<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagios Worship 팀 워크스페이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf-lib for true multi-page PDF merging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- PDF.js for robust PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- 🔥 여기에 발급받은 Firebase 설정값을 넣어주세요 🔥 -->
    <script>
        const __firebase_config = JSON.stringify({
            apiKey: "본인의_API_KEY",
            authDomain: "본인의_PROJECT_ID.firebaseapp.com",
            projectId: "본인의_PROJECT_ID",
            storageBucket: "본인의_PROJECT_ID.appspot.com",
            messagingSenderId: "본인의_SENDER_ID",
            appId: "본인의_APP_ID"
        });
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseAppModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query
        };
        window.firebaseReadyEvent = new Event('firebaseReady');
        window.dispatchEvent(window.firebaseReadyEvent);
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { background-color: #e0e7ff; color: #4f46e5; font-weight: 600; }
        .nav-item.active i { color: #4f46e5; }
        
        /* 버튼 비활성화 스타일 */
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        input:disabled { background-color: #f1f5f9; cursor: not-allowed; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center bg-gray-50">

    <!-- 로그인 / 회원가입 오버레이 화면 -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 fade-in relative overflow-hidden">
            <!-- 로딩 오버레이 (초기 연결 중) -->
            <div id="auth-loading-overlay" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-300">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-3"></i>
                <p class="text-sm font-medium text-gray-600">서버 연결 중...</p>
            </div>

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl mb-4 text-2xl shadow-lg shadow-indigo-200 relative">
                    <i class="fa-solid fa-music"></i>
                    <!-- 연결 상태 인디케이터 -->
                    <div id="auth-connection-dot" class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white bg-gray-400" title="연결 상태 확인 중"></div>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Hagios Worship</h1>
                <p class="text-slate-500 text-sm mt-1" id="auth-subtitle">팀 계정에 로그인하세요</p>
            </div>

            <!-- 로그인 폼 -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">사용자 이름</label>
                    <input type="text" id="login-username" class="auth-input w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="이름을 입력하세요" disabled>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="login-password" class="auth-input w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="비밀번호" disabled>
                </div>
                <button onclick="handleLogin()" id="login-btn" class="auth-btn w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-100 text-sm" disabled>로그인</button>
                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode('signup')" class="auth-btn text-xs text-indigo-600 hover:underline" disabled>계정이 없으신가요? 회원가입</button>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signup-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">사용할 이름</label>
                    <input type="text" id="signup-username" class="auth-input w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="예: 김찬양" disabled>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="signup-password" class="auth-input w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="사용할 비밀번호" disabled>
                </div>
                <button onclick="handleSignup()" id="signup-btn" class="auth-btn w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-100 text-sm" disabled>회원가입 신청</button>
                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode('login')" class="auth-btn text-xs text-slate-600 hover:underline" disabled>이미 계정이 있으신가요? 로그인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="dashboard-screen" class="w-full h-full flex flex-col md:flex-row bg-gray-50 overflow-hidden hidden fade-in">
        
        <aside class="w-full md:w-64 bg-white border-b md:border-r border-gray-200 flex flex-col shadow-sm flex-shrink-0 z-20">
            <!-- Header section -->
            <div class="p-3 md:p-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow flex-shrink-0 relative">
                        <i class="fa-solid fa-music text-white text-sm"></i>
                        <div id="dash-connection-dot" class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full border-2 border-white bg-gray-400" title="연결 상태"></div>
                    </div>
                    <span class="font-bold text-base md:text-lg text-gray-800 whitespace-nowrap">Hagios Worship</span>
                </div>
                <!-- Action Buttons right next to the title on mobile, below on desktop -->
                <div class="flex items-center gap-1.5 md:hidden">
                    <button id="admin-menu-btn-mobile" onclick="openAdminModal()" class="hidden relative bg-amber-100 text-amber-700 hover:bg-amber-200 px-2 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap">
                        <i class="fa-solid fa-shield-halved mr-1"></i>관리
                        <span id="admin-badge-mobile" class="hidden absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                    <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600 p-1.5 bg-gray-100 rounded-lg" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    <button id="mobile-menu-btn" class="text-gray-500 hover:text-indigo-600 p-1.5 bg-gray-100 rounded-lg"><i class="fa-solid fa-bars"></i></button>
                </div>
            </div>
            
            <!-- Desktop Admin/Logout actions -->
            <div class="hidden md:flex flex-col gap-2 p-3 border-b border-gray-100">
                <div class="text-xs text-gray-500 mb-1 px-1 flex items-center justify-between">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-user"></i> <span id="current-user-name">사용자</span></span>
                    <span id="connection-status-text" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">확인중</span>
                </div>
                <div class="flex gap-2">
                    <button id="admin-menu-btn-desktop" onclick="openAdminModal()" class="hidden relative flex-1 bg-amber-100 text-amber-700 hover:bg-amber-200 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-shield-halved"></i> 회원관리
                        <span id="admin-badge-desktop" class="hidden absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full shadow-sm">0</span>
                    </button>
                    <button onclick="handleLogout()" class="flex-1 bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-red-600 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>
                </div>
            </div>

            <!-- Nav -->
            <nav id="sidebar-nav" class="hidden md:flex flex-col flex-1 overflow-y-auto py-2 md:py-4 bg-white md:bg-transparent border-b md:border-0 border-gray-200 absolute md:relative top-[57px] md:top-0 left-0 w-full md:w-auto z-30 shadow-lg md:shadow-none">
                <ul class="space-y-1 px-3">
                    <li><button class="nav-item active w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-dashboard"><i class="fa-solid fa-house w-5 text-center text-gray-400"></i><span>홈 (오버뷰)</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-calendar"><i class="fa-regular fa-calendar-days w-5 text-center text-gray-400"></i><span>캘린더</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-todos"><i class="fa-solid fa-check-double w-5 text-center text-gray-400"></i><span>투두리스트</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-sheetmusic"><i class="fa-solid fa-file-audio w-5 text-center text-gray-400"></i><span>악보</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-audio"><i class="fa-solid fa-headphones w-5 text-center text-gray-400"></i><span>음원</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-konti"><i class="fa-solid fa-list-ol w-5 text-center text-gray-400"></i><span>콘티</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-board"><i class="fa-regular fa-comments w-5 text-center text-gray-400"></i><span>게시판</span></button></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-[calc(100vh-57px)] md:h-screen overflow-hidden bg-gray-50 relative">
            <div id="toast-container" class="absolute bottom-4 right-4 z-50 flex flex-col gap-2 max-w-xs sm:max-w-sm w-full px-4 sm:px-0 pointer-events-none"></div>

            <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 scroll-smooth w-full">
                
                <!-- View: Home Dashboard -->
                <section id="view-dashboard" class="view-section fade-in">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">팀 오버뷰</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition">
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xl flex-shrink-0"><i class="fa-solid fa-list-check"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">남은 할 일</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-todos">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition">
                            <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xl flex-shrink-0"><i class="fa-solid fa-list-ol"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">등록된 콘티</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-konti">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition">
                            <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-xl flex-shrink-0"><i class="fa-solid fa-file-lines"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">등록된 악보</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-sheet">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition">
                            <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 text-xl flex-shrink-0"><i class="fa-solid fa-music"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">공유된 음원</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-audio">0</p></div>
                        </div>
                    </div>
                </section>

                <!-- View: Calendar -->
                <section id="view-calendar" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">캘린더</h2>
                        <button onclick="openCalendarEventModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 일정 추가
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center gap-2">
                                <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <h3 id="calendar-title" class="font-bold text-sm sm:text-lg text-gray-800 w-24 text-center">2026년 9월</h3>
                                <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            </div>
                            <button onclick="resetCalendarToCurrent()" class="text-xs text-indigo-600 font-semibold hover:underline">오늘로 이동</button>
                        </div>
                        <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-xs sm:text-sm font-medium text-gray-500">
                            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
                        </div>
                        <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs sm:text-sm" id="calendar-grid"></div>
                    </div>
                </section>

                <!-- View: Todo List -->
                <section id="view-todos" class="view-section hidden fade-in">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">투두리스트</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[500px] sm:h-[600px] max-h-[70vh]">
                        <div class="p-3 sm:p-4 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row gap-2">
                            <input type="text" id="todo-input" class="flex-1 px-3 sm:px-4 py-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="할 일을 입력하세요 (Enter 키로 추가 가능)">
                            <div class="flex items-center gap-1">
                                <span class="text-xs text-gray-500 font-medium whitespace-nowrap">기한:</span>
                                <input type="date" id="todo-date" class="px-3 py-2 text-xs sm:text-sm border border-gray-300 rounded-lg outline-none focus:border-indigo-500 bg-white cursor-pointer">
                            </div>
                            <button id="add-todo-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 sm:px-5 py-2 text-xs sm:text-sm rounded-lg font-medium transition shadow-sm whitespace-nowrap">추가</button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-3 sm:p-4" id="todo-list"></div>
                    </div>
                </section>
                
                <!-- View: Sheet Music -->
                <section id="view-sheetmusic" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">악보</h2>
                        <button onclick="openModal('sheet-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 악보 업로드
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="sheet-search" oninput="loadSheets()" class="w-full pl-11 pr-4 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none shadow-sm transition" placeholder="악보 제목 검색...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="sheet-list"></div>
                </section>

                <!-- View: Audio -->
                <section id="view-audio" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">음원</h2>
                        <button onclick="openModal('audio-modal')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 음원 등록
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="audio-search" oninput="loadAudio()" class="w-full pl-11 pr-4 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none shadow-sm transition" placeholder="음원 제목 검색...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-4" id="audio-list"></div>
                </section>

                <!-- View: Konti -->
                <section id="view-konti" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">콘티</h2>
                        <button onclick="openModal('konti-modal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 콘티 만들기
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

    <script>
        let db = null;
        let auth = null;
        let currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hagios-worship-app';
        let currentCalendarDate = new Date();
        let store = { users: [], todos: [], calendar: [], sheets: [], audio: [], board: [], konti: [] };
        
        // 상태 변수 추가
        let isFirebaseReady = false;
        let isCloudMode = false;

        // 커스텀 알럿 로직
        let alertCallback = null;
        function showAlert(title, message, type = 'info', buttonText = '확인', callback = null) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            document.getElementById('alert-action-btn').textContent = buttonText;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if (type === 'success') {
                iconContainer.className = 'w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-check';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else if (type === 'error') {
                iconContainer.className = 'w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-xmark';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else {
                iconContainer.className = 'w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-circle-info';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            }

            alertCallback = callback;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            if (alertCallback) { alertCallback(); alertCallback = null; }
        }
        document.getElementById('alert-action-btn').addEventListener('click', closeAlert);

        // 커스텀 확인 로직
        let confirmCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = callback;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', async () => {
            if (confirmCallback) await confirmCallback();
            closeCustomConfirm();
        });

        window.addEventListener('firebaseReady', async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseAppModules;
            try {
                // 설정 확인
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                const firebaseConfig = JSON.parse(configStr);
                
                if (Object.keys(firebaseConfig).length === 0) {
                    throw new Error("No Firebase config provided. Offline mode.");
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // 완벽한 인증 완료 대기
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                isCloudMode = true;
                initFirebaseListeners();
                
            } catch (err) {
                console.warn("Firebase 연결 실패 (로컬 모드로 실행됩니다):", err);
                isCloudMode = false;
                initLocalFallback();
            } finally {
                // 초기화가 완전히 끝난 후 상태 변경
                isFirebaseReady = true;
                updateConnectionStatusUI();
                enableAuthForms();
                
                // 로그인 상태 체크를 마지막에 실행
                setTimeout(() => {
                    checkSavedLogin();
                }, 100);
            }
        });

        // UI 상태 업데이트 함수들
        function updateConnectionStatusUI() {
            const authDot = document.getElementById('auth-connection-dot');
            const dashDot = document.getElementById('dash-connection-dot');
            const dashText = document.getElementById('connection-status-text');
            
            const colorClass = isCloudMode ? 'bg-emerald-500' : 'bg-amber-400';
            const titleText = isCloudMode ? '클라우드 동기화 됨' : '로컬 모드 (서버 동기화 안됨)';
            
            if(authDot) {
                authDot.className = `absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white ${colorClass}`;
                authDot.title = titleText;
            }
            if(dashDot) {
                dashDot.className = `absolute -bottom-1 -right-1 w-3 h-3 rounded-full border-2 border-white ${colorClass}`;
                dashDot.title = titleText;
            }
            if(dashText) {
                dashText.textContent = isCloudMode ? 'Cloud' : 'Local';
                dashText.className = `text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm ${isCloudMode ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`;
                dashText.title = titleText;
            }
        }

        function enableAuthForms() {
            const overlay = document.getElementById('auth-loading-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }
            
            document.querySelectorAll('.auth-input, .auth-btn').forEach(el => {
                el.removeAttribute('disabled');
            });
        }

        function checkSavedLogin() {
            const savedUser = localStorage.getItem('hagios_current_user');
            if(savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    startWorkspace();
                } catch(e) {
                    localStorage.removeItem('hagios_current_user');
                }
            }
        }

        function initLocalFallback() {
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(key => {
                if (!localStorage.getItem('ccm_' + key)) localStorage.setItem('ccm_' + key, JSON.stringify([]));
                store[key] = JSON.parse(localStorage.getItem('ccm_' + key)) || [];
            });
            refreshUI();
        }

        function initFirebaseListeners() {
            const { collection, onSnapshot, query } = window.firebaseAppModules;
            const attachListener = (collectionName, storeKey) => {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', collectionName));
                onSnapshot(q, (snapshot) => {
                    store[storeKey] = [];
                    snapshot.forEach(docSnap => { store[storeKey].push({ id: docSnap.id, ...docSnap.data() }); });
                    
                    if(collectionName === 'users') {
                        updateAdminBadge(); // 새로운 사용자가 등록되면 뱃지 즉시 업데이트
                        if(currentUser && currentUser.isAdmin) {
                            renderAdminViews(); // 관리자 뷰가 열려있다면 즉시 새로고침
                        }
                    }
                    if(currentUser) refreshUI();
                }, (error) => { console.error(`Error loading ${collectionName}:`, error); });
            };
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(k => attachListener(k, k));
        }
        
        function updateAdminBadge() {
            if (!currentUser || !currentUser.isAdmin) return;
            
            const users = getCollectionData('users');
            const pendingCount = users.filter(u => u.status === 'pending').length;
            
            const desktopBadge = document.getElementById('admin-badge-desktop');
            const mobileBadge = document.getElementById('admin-badge-mobile');
            
            if (pendingCount > 0) {
                if(desktopBadge) { desktopBadge.textContent = pendingCount; desktopBadge.classList.remove('hidden'); }
                if(mobileBadge) { mobileBadge.textContent = pendingCount; mobileBadge.classList.remove('hidden'); }
            } else {
                if(desktopBadge) desktopBadge.classList.add('hidden');
                if(mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        function refreshUI() {
            renderCalendar();
            loadTodos();
            loadSheets();
            loadAudio();
            loadBoard();
            loadKonti();
            updateStats();
        }

        async function dbAdd(collectionName, data) {
            if (!isFirebaseReady) {
                console.error("앱이 아직 초기화되지 않았습니다.");
                return false;
            }
            
            if (isCloudMode && db && auth && auth.currentUser) {
                try {
                    const { collection, addDoc } = window.firebaseAppModules;
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), data);
                    return true;
                } catch(e) {
                    console.error("Cloud Add Error:", e);
                    return false;
                }
            } else {
                // LocalStorage fallback
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list.unshift({ id: 'local_' + Date.now(), ...data });
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
                return true;
            }
        }

        async function dbUpdate(collectionName, id, data) {
            if (isCloudMode && db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, updateDoc } = window.firebaseAppModules;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.map(item => item.id == id ? { ...item, ...data } : item);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbDelete(collectionName, id) {
            if (isCloudMode && db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.filter(item => item.id != id);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        function getCollectionData(collectionName) {
            // 스토어가 채워져있으면 우선 반환, 아니면 로컬 탐색
            if (store[collectionName] && store[collectionName].length > 0) return store[collectionName];
            return JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
        }

        function toggleAuthMode(mode) {
            if(mode === 'signup') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('signup-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '간편하게 팀 계정을 만드세요';
            } else {
                document.getElementById('signup-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '팀 계정에 로그인하세요';
            }
        }

        async function handleSignup() {
            if (!isFirebaseReady) return;
            
            const btn = document.getElementById('signup-btn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '처리 중...';

            try {
                const username = document.getElementById('signup-username').value.trim();
                const password = document.getElementById('signup-password').value.trim();
                
                if(!username || !password) {
                    showToast('이름과 비밀번호를 모두 입력해주세요.', 'error');
                    return;
                }
                
                const users = getCollectionData('users');
                if(users.find(u => u.username === username)) {
                    showToast('이미 존재하는 이름입니다.', 'error');
                    return;
                }
                
                const success = await dbAdd('users', { username, password, status: 'pending', isAdmin: false, createdAt: Date.now() });
                
                if (success) {
                    document.getElementById('signup-username').value = '';
                    document.getElementById('signup-password').value = '';

                    let extraMessage = isCloudMode ? '' : '\n(주의: 현재 기기에만 저장되는 로컬 모드입니다)';
                    
                    showAlert(
                        '가입 신청 완료',
                        `회원가입 신청이 완료되었습니다.\n관리자의 승인이 떨어지면 로그인이 가능합니다.${extraMessage}`,
                        'success',
                        '로그인 화면으로 돌아가기',
                        () => { toggleAuthMode('login'); }
                    );
                } else {
                    showToast('회원가입 처리 중 문제가 발생했습니다.', 'error');
                }
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function handleLogin() {
            if (!isFirebaseReady) return;

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            // 마스터 관리자 하드코딩
            if(username === '관리자' && password === 'hagios') {
                currentUser = { id: 'admin_main', username: '관리자', isAdmin: true, status: 'approved' };
                localStorage.setItem('hagios_current_user', JSON.stringify(currentUser));
                startWorkspace();
                return;
            }

            const users = getCollectionData('users');
            const user = users.find(u => u.username === username);

            if(!user) {
                showAlert('로그인 실패', '가입되지 않은 이름입니다. 먼저 회원가입을 진행해주세요.', 'error');
                return;
            }
            if(user.password !== password) {
                showAlert('로그인 실패', '비밀번호 오류입니다.', 'error', '다시 입력하기');
                return;
            }
            if(user.status === 'pending') {
                showAlert('승인 대기 중', '관리자 승인을 기다리고 있습니다.\n승인 후 로그인해주세요.', 'info', '확인');
                return;
            }
            if(user.status === 'suspended') {
                showAlert('이용 정지', '일시 정지된 계정입니다.\n관리자에게 문의하세요.', 'error', '확인');
                return;
            }

            currentUser = user;
            localStorage.setItem('hagios_current_user', JSON.stringify(user));
            startWorkspace();
        }

        function handleLogout() {
            localStorage.removeItem('hagios_current_user');
            currentUser = null;
            location.reload();
        }

                    showToast(`${username}님의 계정이 정지되었습니다.`, 'info');
                    renderAdminViews();
                    updateAdminBadge();
                });

                    showToast(`${username}님의 계정이 삭제되었습니다.`, 'info');
                    renderAdminViews();
                    updateAdminBadge();

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                'success': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                'error': 'bg-red-100 text-red-800 border-red-200',
                'info': 'bg-indigo-100 text-indigo-800 border-indigo-200'
            };
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border ${colors[type]} fade-in pointer-events-auto backdrop-blur-md bg-opacity-90`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span class="text-sm font-semibold">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px) scale(0.95)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function loadTodos() {
            const list = document.getElementById('todo-list');
            const todos = getCollectionData('todos');
            list.innerHTML = '';

                list.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm flex flex-col items-center"><i class="fa-solid fa-clipboard-check text-4xl mb-3 opacity-30"></i>모든 할 일을 마쳤습니다!</div>`;

                let dateStr = '';
                if(todo.dueDate) {
                    const today = new Date().toISOString().split('T')[0];
                    let dateColor = 'text-indigo-600 bg-indigo-50 border-indigo-100';
                    if(!todo.completed && todo.dueDate < today) dateColor = 'text-red-600 bg-red-50 border-red-100 font-bold';
                    dateStr = `<span class="text-[10px] ${dateColor} border px-2 py-0.5 rounded-md font-medium flex-shrink-0">${escapeHtml(todo.dueDate)}</span>`;

            await dbAdd('todos', { text, dueDate: dateInput.value, completed: false, createdAt: Date.now() });

        window.toggleTodo = async (id) => {
            const todo = getCollectionData('todos').find(t => t.id == id);
            if(todo) await dbUpdate('todos', id, { completed: !todo.completed });
        };

        window.moveTodoOrder = async (id, direction) => {
            let todos = getCollectionData('todos');
            const index = todos.findIndex(t => t.id == id);
            if (index === -1) return;
            if (direction === 'up' && index > 0) {
                const temp = todos[index]; todos[index] = todos[index - 1]; todos[index - 1] = temp;
            } else if (direction === 'down' && index < todos.length - 1) {
                const temp = todos[index]; todos[index] = todos[index + 1]; todos[index + 1] = temp;
            } else return;
            
            // Note: Firebase doesn't support manual ordering easily without a specific field. 
            // For now, this just updates local view if cloud is on, or updates local storage completely.
            if (isCloudMode) { 
                store.todos = todos; loadTodos(); 
                // To persist order in cloud, we'd need an 'order' field in DB and update all docs. Skipping for simplicity here.
            } else { 
                localStorage.setItem('ccm_todos', JSON.stringify(todos)); store.todos = todos; loadTodos(); 
            }
        };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const titleEl = document.getElementById('calendar-title');
            if(!grid || !titleEl) return;
            grid.innerHTML = '';
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const calendarEvents = getCollectionData('calendar');

            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="p-1 sm:p-2 border border-transparent rounded-xl bg-gray-50/50 min-h-[80px] sm:min-h-[110px]"></div>`;
            }

            for(let i = 1; i <= totalDays; i++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
                const bgClass = isToday ? 'bg-indigo-50 border-indigo-200 shadow-inner' : 'bg-white border-gray-100 hover:border-indigo-300';
                
                // 날짜 색상 (일요일 빨강, 토요일 파랑)
                const currentDayIndex = new Date(year, month, i).getDay();
                let textClass = 'text-gray-700';
                if(currentDayIndex === 0) textClass = 'text-red-500';
                else if (currentDayIndex === 6) textClass = 'text-blue-500';
                if(isToday) textClass = 'text-indigo-700 font-black';

                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const dayEvents = calendarEvents.filter(ev => {
                    if (!ev.startDate) return false;
                    return dateKey >= ev.startDate && dateKey <= (ev.endDate || ev.startDate);
                });

                let eventsHtml = '';
                dayEvents.slice(0, 3).forEach(dt => {
                    eventsHtml += `<div class="text-[9px] sm:text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded truncate w-full text-left mt-1 font-medium shadow-sm" title="${escapeHtml(dt.text)}">${escapeHtml(dt.text)}</div>`;
                });
                if (dayEvents.length > 3) {
                    eventsHtml += `<div class="text-[9px] text-gray-500 font-bold mt-1 px-1">+${dayEvents.length - 3}개 더보기</div>`;
                }

                grid.innerHTML += `<div onclick="openCalendarDateModal('${dateKey}')" class="p-1.5 sm:p-2 border rounded-xl ${bgClass} min-h-[80px] sm:min-h-[110px] flex flex-col justify-start items-start overflow-hidden cursor-pointer transition group">
                    <div class="w-full flex justify-between items-center mb-1">
                        <span class="${textClass} text-xs sm:text-sm font-semibold">${i}</span>
                        <span class="text-[10px] text-gray-300 group-hover:text-indigo-500 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-plus"></i></span>
                    </div>
                    <div class="w-full flex flex-col gap-0.5 overflow-hidden">${eventsHtml}</div>
                </div>`;
            }
        }

        window.resetCalendarToCurrent = () => { currentCalendarDate = new Date(); renderCalendar(); };

        document.getElementById('save-cal-event-btn').addEventListener('click', async () => {
            const text = document.getElementById('cal-event-text').value.trim();
            const startDate = document.getElementById('cal-event-start').value;

        window.moveSheetOrder = (sheetId, dir) => {
            const container = document.getElementById('konti-sheets-checkboxes');
            const items = Array.from(container.children);
            const index = items.findIndex(item => item.querySelector('.konti-sheet-checkbox')?.value == sheetId);
            if (index === -1) return;
            if (dir === 'up' && index > 0) {
                container.insertBefore(items[index], items[index - 1]);
                items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else if (dir === 'down' && index < items.length - 1) {
                container.insertBefore(items[index + 1], items[index]);
                items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        };

            document.getElementById('konti-edit-id').value = konti.id;
            document.getElementById('konti-name').value = konti.name;
            document.getElementById('konti-modal-title').textContent = '콘티 수정';
            renderKontiSheetCheckboxes(konti.sheetIds || []);
            document.getElementById('konti-modal').classList.remove('hidden');
        };

        window.deleteKonti = async (id) => { 
            showCustomConfirm('콘티 삭제', '이 콘티를 삭제하시겠습니까?\n포함된 악보 파일 자체는 삭제되지 않습니다.', async () => {
                await dbDelete('konti', id); showToast('콘티가 삭제되었습니다.', 'info'); 
            });
        };

        window.downloadKontiMergedPdf = async (kontiId, btnId) => {
            let konti = getCollectionData('konti').find(k => k.id == kontiId);
            let sheets = getCollectionData('sheets');
            if (!konti) return;
            
            const kontiSheets = (konti.sheetIds || []).map(id => sheets.find(s => s.id == id)).filter(s => s !== undefined);
            if (kontiSheets.length === 0) { showToast('포함된 악보가 없어 PDF를 생성할 수 없습니다.', 'error'); return; }

            const btn = document.getElementById(btnId);
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 생성중...';

            showToast(`[${konti.name}] 병합을 시작합니다. 잠시만 기다려주세요.`, 'info');
            
            // 브라우저 렌더링 블로킹 방지를 위해 타임아웃 사용
            setTimeout(async () => {
                try {
                    const { PDFDocument } = PDFLib;
                    const mergedPdf = await PDFDocument.create();

                    for (let i = 0; i < kontiSheets.length; i++) {
                        let sheet = kontiSheets[i];
                        let dataUrl = sheet.data;
                        if (!dataUrl) continue;

                        try {
                            let base64Data = dataUrl.split(',')[1];
                            let binaryString = atob(base64Data);
                            let len = binaryString.length;
                            let bytes = new Uint8Array(len);
                            for (let j = 0; j < len; j++) { bytes[j] = binaryString.charCodeAt(j); }

                            if (dataUrl.includes('application/pdf')) {
                                const donorPdf = await PDFDocument.load(bytes);
                                const copiedPages = await mergedPdf.copyPages(donorPdf, donorPdf.getPageIndices());
                                copiedPages.forEach((page) => mergedPdf.addPage(page));
                            } else if (dataUrl.includes('image/')) {
                                let embeddedImage;
                                if (dataUrl.includes('image/png')) embeddedImage = await mergedPdf.embedPng(bytes);
                                else embeddedImage = await mergedPdf.embedJpg(bytes);
                                
                                // A4 비율 기준으로 이미지 크기 조정 (선택적)
                                const page = mergedPdf.addPage([embeddedImage.width, embeddedImage.height]);
                                page.drawImage(embeddedImage, {
                                    x: 0, y: 0, width: embeddedImage.width, height: embeddedImage.height,
                                });
                            }
                        } catch (e) {
                            console.error(`Error processing sheet ${sheet.title}:`, e);
                        }
                    }

                    const mergedPdfBytes = await mergedPdf.save();
                    const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    // 파일명에 공백 대신 언더바 사용
                    const safeFileName = konti.name.replace(/ /g, '_');
                    link.download = `${safeFileName}_전체악보.pdf`;
                    link.click();
                    
                    showToast('PDF 다운로드가 시작되었습니다.', 'success');
                } catch (err) {
                    console.error("PDF merge error:", err);
                    showToast('PDF 생성 중 오류가 발생했습니다. 악보 파일 형식을 확인해주세요.', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalBtnHtml;
                }
            }, 100);
        };

        function loadBoard() {
            const list = document.getElementById('board-list');
            const posts = getCollectionData('board');
            
            // 시간순 정렬 (오래된 것이 위로)
            posts.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));

            list.innerHTML = '';
            if(posts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-20 flex-1 flex flex-col items-center justify-center text-sm"><i class="fa-regular fa-comments text-4xl mb-3 opacity-30"></i>첫 공지나 이야기를 남겨보세요.</div>`;
                return;
            }
            
            posts.forEach(post => {
                const item = document.createElement('div');
                // 모든 메시지는 좌측 정렬 (채팅보다는 게시판 느낌)
                item.className = 'flex flex-col w-full sm:w-[90%] self-start items-start mb-3 group';
                
                const authorName = post.author ? `<div class="text-[11px] font-bold text-gray-600 ml-2 mb-1">${escapeHtml(post.author)}</div>` : '';

                item.innerHTML = `
                    ${authorName}
                    <div class="flex items-end gap-2 w-full">
                        <div class="px-4 py-3 rounded-2xl bg-white border border-gray-200 text-gray-800 shadow-sm text-sm whitespace-pre-wrap leading-relaxed w-full">${escapeHtml(post.text)}</div>
                        <div class="flex flex-col items-start gap-1 flex-shrink-0 min-w-[50px]">
                            <span class="text-[10px] text-gray-400 font-medium">${post.time}</span>
                            <button class="text-gray-300 hover:text-red-500 transition text-xs opacity-0 group-hover:opacity-100" onclick="deletePost('${post.id}')" title="삭제"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
            // 스크롤 맨 아래로 이동
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
        }

        let isSubmittingPost = false; // 중복 전송 방지용 안전장치 추가

        // 엔터키 입력 완벽 제어
        document.getElementById('board-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!e.shiftKey) {
                    // 1. Shift 없이 엔터만 쳤을 때: 전송
                    e.preventDefault(); // 기본 동작인 줄바꿈 방지
                    if (e.isComposing) return; // 한글 입력 조합 중복 방지 (두번 써지는 현상 제거)
                    document.getElementById('add-post-btn').click();
                }
                // 2. Shift + Enter 일 때: 이 if문 안으로 들어오지 않으므로 기본 동작인 '줄바꿈'만 실행됨 (전송 안 됨)
            }
        });

        document.getElementById('add-post-btn').addEventListener('click', async () => {
            if (isSubmittingPost) return; // 이미 전송 중이면 두 번 눌리지 않게 차단
            
            const input = document.getElementById('board-input');
            const text = input.value.trim();
            if(!text) return;
            
            isSubmittingPost = true; // 전송 시작
            const btn = document.getElementById('add-post-btn');
            btn.disabled = true;
            
            try {
                const now = new Date();
                const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                const authorName = currentUser ? currentUser.username : '알 수 없음';
                
                await dbAdd('board', { text, time: timeStr, author: authorName, createdAt: Date.now() });
                
                input.value = '';
            } finally {
                isSubmittingPost = false; // 전송 완료 후 해제
                btn.disabled = false;
                
                // 스크롤 다운을 위해 약간의 딜레이
                setTimeout(() => {
                    const list = document.getElementById('board-list');
                    list.scrollTop = list.scrollHeight;
                }, 100);
            }
        });

        window.deletePost = async (id) => { 
            showCustomConfirm('게시글 삭제', '이 내용을 삭제하시겠습니까?', async () => {
                await dbDelete('board', id); 
            });
        };

        function openModal(id) {
            if (id === 'sheet-modal') {
                document.getElementById('sheet-edit-id').value = '';
                document.getElementById('sheet-title').value = '';
                document.getElementById('sheet-file').value = '';
                document.getElementById('sheet-file-name').textContent = "선택된 파일 없음";
                document.getElementById('sheet-modal-title').textContent = '새 악보 등록';
            } else if (id === 'konti-modal') {
                document.getElementById('konti-edit-id').value = '';
                document.getElementById('konti-name').value = '';
                document.getElementById('konti-modal-title').textContent = '새 콘티 만들기';
                if(document.getElementById('konti-sheet-search')) document.getElementById('konti-sheet-search').value = '';
                renderKontiSheetCheckboxes();
            } else if (id === 'audio-modal') {
                document.getElementById('audio-edit-id').value = '';
                document.getElementById('audio-title').value = '';
                document.getElementById('audio-file').value = '';
                document.getElementById('audio-url').value = '';
                document.getElementById('audio-modal-title').textContent = '새 음원 등록';
            }
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
