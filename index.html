    <script>
        let db, auth, appId, userId = null;
        let currentUserData = null;
        let allUsers = [];
        let pendingUsers = [];
        let activeUsers = [];
        
        let sheetsData = [];
        let audioData = [];
        let kontiData = [];
        let todosData = [];
        let calendarData = [];
        let boardData = [];

        let currentCalendarYear = new Date().getFullYear();
        let currentCalendarMonth = new Date().getMonth();
        let selectedCalendarDateStr = null;

        const appIdConst = typeof __app_id !== 'undefined' ? __app_id : 'hagios-worship-default';

        window.addEventListener('firebaseReady', async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseAppModules;
            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            appId = appIdConst;

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid || crypto.randomUUID();
            } catch (e) {
                try {
                    await signInAnonymously(auth);
                    userId = auth.currentUser?.uid || crypto.randomUUID();
                } catch (err) {
                    userId = crypto.randomUUID();
                }
            }

            initApp();
        });

        if (typeof window.firebaseAppModules === 'undefined') {
            setTimeout(() => {
                if (typeof window.firebaseAppModules === 'undefined') {
                    userId = crypto.randomUUID();
                    appId = appIdConst;
                    initApp();
                }
            }, 1000);
        }

        function initApp() {
            const savedUser = localStorage.getItem('hagios_current_user');
            if (savedUser) {
                try {
                    currentUserData = JSON.parse(savedUser);
                    document.getElementById('current-user-name').innerText = currentUserData.name + (currentUserData.role === 'admin' ? ' (관리자)' : '');
                    if (currentUserData.role === 'admin') {
                        document.getElementById('admin-menu-btn-desktop').classList.remove('hidden');
                        document.getElementById('admin-menu-btn-mobile').classList.remove('hidden');
                    }
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    startFirestoreListeners();
                } catch (e) {
                    localStorage.removeItem('hagios_current_user');
                }
            }
            
            setupGlobalListeners();
            renderCalendar();
            
            window.addEventListener('popstate', (event) => {
                const targetView = event.state && event.state.view ? event.state.view : 'view-dashboard';
                switchViewWithoutHistory(targetView);
            });
            history.replaceState({ view: 'view-dashboard' }, '', '');
        }

        function toggleAuthMode(mode) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const subtitle = document.getElementById('auth-subtitle');
            if (mode === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                subtitle.innerText = '새 계정 가입 신청을 하세요';
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                subtitle.innerText = '팀 계정에 로그인하세요';
            }
        }

        async function handleSignup() {
            const name = document.getElementById('signup-username').value.trim();
            const pass = document.getElementById('signup-password').value.trim();
            if (!name || !pass) {
                showAlert('입력 오류', '이름과 비밀번호를 모두 입력해주세요.');
                return;
            }
            if (!db) {
                showAlert('연결 오류', '데이터베이스 연결을 확인해주세요.');
                return;
            }
            try {
                const { collection, addDoc } = window.firebaseAppModules;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'), {
                    name, pass, role: 'member', status: 'pending', createdAt: Date.now()
                });
                showAlert('신청 완료', '회원가입 신청이 완료되었습니다.\n관리자 승인 후 로그인할 수 있습니다.');
                toggleAuthMode('login');
            } catch (e) {
                showAlert('오류', '회원가입 중 오류가 발생했습니다.');
            }
        }

        async function handleLogin() {
            const name = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if (!name || !pass) {
                showAlert('입력 오류', '이름과 비밀번호를 입력해주세요.');
                return;
            }
            
            if (name === '관리자' && pass === '1234') {
                loginSuccess({ id: 'admin', name: '관리자', role: 'admin', status: 'active' });
                return;
            }

            if (!db) {
                showAlert('로그인 실패', '데이터베이스에 연결되지 않았습니다.');
                return;
            }

            try {
                const { collection, getDocs, query } = window.firebaseAppModules;
                const snap = await getDocs(query(collection(db, 'artifacts', appId, 'public', 'data', 'users')));
                let found = null;
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.name === name && data.pass === pass) {
                        found = { id: docSnap.id, ...data };
                    }
                });

                if (!found) {
                    showAlert('로그인 실패', '이름 또는 비밀번호가 올바르지 않습니다.');
                    return;
                }
                if (found.status === 'pending') {
                    showAlert('승인 대기중', '아직 관리자 승인이 완료되지 않았습니다.');
                    return;
                }

                loginSuccess(found);
            } catch (e) {
                showAlert('로그인 오류', '로그인 처리 중 문제가 발생했습니다.');
            }
        }

        function loginSuccess(userData) {
            currentUserData = userData;
            localStorage.setItem('hagios_current_user', JSON.stringify(userData));
            document.getElementById('current-user-name').innerText = userData.name + (userData.role === 'admin' ? ' (관리자)' : '');
            if (userData.role === 'admin') {
                document.getElementById('admin-menu-btn-desktop').classList.remove('hidden');
                document.getElementById('admin-menu-btn-mobile').classList.remove('hidden');
            }
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            startFirestoreListeners();
        }

        function handleLogout() {
            localStorage.removeItem('hagios_current_user');
            currentUserData = null;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function navigateToView(targetId, skipHistory = false) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            const targetEl = document.getElementById(targetId);
            if (targetEl) targetEl.classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.getAttribute('data-target') === targetId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

        function triggerUniversalDownload(fileData, fileName) {
            try {
                let blob;
                if (fileData.startsWith('data:')) {
                    const arr = fileData.split(',');
                    const mimeMatch = arr[0].match(/:(.*?);/);
                    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    while (n--) {
                        u8arr[n] = bstr.charCodeAt(n);
                    }
                    blob = new Blob([u8arr], { type: mime });
                } else {
                    blob = new Blob([fileData], { type: 'application/octet-stream' });
                }

                const blobUrl = URL.createObjectURL(blob);
                const modal = document.getElementById('download-modal');
                const titleEl = document.getElementById('download-modal-title');
                const linkBtn = document.getElementById('download-link-btn');
                
                titleEl.innerText = fileName + ' 파일 준비 완료';
                linkBtn.href = blobUrl;
                linkBtn.setAttribute('download', fileName);
                modal.classList.remove('hidden');

                const tempLink = document.createElement('a');
                tempLink.href = blobUrl;
                tempLink.download = fileName;
                tempLink.style.display = 'none';
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
            } catch (e) {
                showAlert('다운로드 오류', '파일을 다운로드하는 중 문제가 발생했습니다.');
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function loadTodos() {
            const container = document.getElementById('todo-list');
            if (!container) return;
            container.innerHTML = '';

            if (todosData.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">등록된 할 일이 없습니다.</div>`;
                return;
            }

            todosData.sort((a, b) => a.createdAt - b.createdAt).forEach(t => {
                const isOwner = currentUserData && (currentUserData.role === 'admin' || t.uploader === currentUserData.name);
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2.5 rounded-xl border border-gray-100 hover:bg-gray-50 transition mb-2';
                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo('${t.id}', ${!t.completed})" class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <div class="truncate">
                            <p class="text-xs sm:text-sm ${t.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${escapeHtml(t.text)}</p>
                            ${t.date ? `<span class="text-[11px] text-indigo-600 font-medium">${t.date}</span>` : ''}
                        </div>
                    </div>
                    ${isOwner ? `<button onclick="deleteTodo('${t.id}')" class="text-gray-400 hover:text-red-600 p-1.5"><i class="fa-solid fa-trash text-xs sm:text-sm"></i></button>` : ''}
                `;
                container.appendChild(item);
            });
        }

        async function toggleTodo(id, completed) {
            if (!db) return;
            const { doc, updateDoc } = window.firebaseAppModules;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { completed });
        }

        function deleteTodo(id) {
            if (!db) return;
            const { doc, deleteDoc } = window.firebaseAppModules;
            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id));
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendar-title');
            const gridEl = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;

            titleEl.innerText = `${currentCalendarYear}년 ${currentCalendarMonth + 1}월`;
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(currentCalendarYear, currentCalendarMonth, 1).getDay();
            const lastDay = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-16 sm:h-24 bg-gray-50/50 rounded-xl border border-transparent';
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(currentCalendarMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateStr = `${currentCalendarYear}-${monthStr}-${dayStr}`;

                const dayEvents = calendarData.filter(ev => ev.date === dateStr);
                const isSelected = selectedCalendarDateStr === dateStr;

                const cell = document.createElement('div');
                cell.className = `h-16 sm:h-24 p-1.5 rounded-xl border flex flex-col justify-between cursor-pointer transition overflow-hidden ${isSelected ? 'border-indigo-600 bg-indigo-50/40 shadow-xs' : 'border-gray-200 bg-white hover:border-indigo-300'}`;
                cell.onclick = () => selectCalendarDate(dateStr);

                let eventsHtml = dayEvents.slice(0, 1).map(ev => `
                    <div class="text-[10px] sm:text-xs bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-md truncate font-medium">
                        ${ev.time ? ev.time + ' ' : ''}${escapeHtml(ev.title)}
                    </div>
                `).join('');

                if (dayEvents.length > 1) {
                    eventsHtml += `<div class="text-[9px] text-gray-400 text-right pr-0.5">+${dayEvents.length - 1}개</div>`;
                }

                cell.innerHTML = `
                    <div class="flex justify-between items-center text-xs sm:text-sm">
                        <span class="font-bold ${isSelected ? 'text-indigo-700' : 'text-gray-700'}">${day}</span>
                        ${dayEvents.length > 0 ? `<span class="w-2 h-2 rounded-full bg-indigo-600"></span>` : ''}
                    </div>
                    <div class="flex flex-col gap-1 overflow-hidden">${eventsHtml}</div>
                `;
                gridEl.appendChild(cell);
            }

            if (selectedCalendarDateStr) {
                renderCalendarDetail(selectedCalendarDateStr);
            }
        }

        function changeCalendarMonth(diff) {
            currentCalendarMonth += diff;
            if (currentCalendarMonth > 11) {
                currentCalendarMonth = 0;
                currentCalendarYear++;
            } else if (currentCalendarMonth < 0) {
                currentCalendarMonth = 11;
                currentCalendarYear--;
            }
            renderCalendar();
        }

        function resetCalendarToCurrent() {
            const now = new Date();
            currentCalendarYear = now.getFullYear();
            currentCalendarMonth = now.getMonth();
            renderCalendar();
        }

        function selectCalendarDate(dateStr) {
            selectedCalendarDateStr = dateStr;
            renderCalendar();
            renderCalendarDetail(dateStr);
        }

        function renderCalendarDetail(dateStr) {
            const panel = document.getElementById('calendar-detail-panel');
            const dateTitle = document.getElementById('calendar-detail-date-title');
            const content = document.getElementById('calendar-detail-content');
            if (!panel || !dateTitle || !content) return;

            const dayEvents = calendarData.filter(ev => ev.date === dateStr);
            
            if (dayEvents.length === 0) {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            dateTitle.innerText = dateStr;
            content.innerHTML = '';

            dayEvents.forEach(ev => {
                const isOwner = currentUserData && (currentUserData.role === 'admin' || ev.uploader === currentUserData.name);
                const box = document.createElement('div');
                box.className = 'p-3 rounded-xl bg-gray-50 border border-gray-200 flex flex-col gap-1.5';
                box.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-800 text-xs sm:text-sm">${ev.time ? '[' + ev.time + '] ' : ''}${escapeHtml(ev.title)}</span>
                        <div class="flex gap-1.5">
                            ${isOwner ? `
                                <button onclick="openEditCalendarEvent('${ev.id}')" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteCalendarEvent('${ev.id}')" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                            ` : ''}
                        </div>
                    </div>
                    ${ev.desc ? `<p class="text-xs sm:text-sm text-gray-600 whitespace-pre-line mt-0.5">${escapeHtml(ev.desc)}</p>` : ''}
                `;
                content.appendChild(box);
            });
        }

        function openCalendarEventModal() {
            document.getElementById('calendar-event-edit-id').value = '';
            document.getElementById('calendar-event-date').value = selectedCalendarDateStr || new Date().toISOString().split('T')[0];
            document.getElementById('calendar-event-time').value = '';
            document.getElementById('calendar-event-title').value = '';
            document.getElementById('calendar-event-desc').value = '';
            document.getElementById('calendar-modal-title').innerText = '일정 추가';
            openModal('calendar-event-modal');
        }

        function openEditCalendarEvent(id) {
            const ev = calendarData.find(x => x.id === id);
            if (!ev) return;
            document.getElementById('calendar-event-edit-id').value = ev.id;
            document.getElementById('calendar-event-date').value = ev.date;
            document.getElementById('calendar-event-time').value = ev.time || '';
            document.getElementById('calendar-event-title').value = ev.title;
            document.getElementById('calendar-event-desc').value = ev.desc || '';
            document.getElementById('calendar-modal-title').innerText = '일정 수정';
            openModal('calendar-event-modal');
        }

        async function saveCalendarEvent() {
            const editId = document.getElementById('calendar-event-edit-id').value;
            const date = document.getElementById('calendar-event-date').value;
            const time = document.getElementById('calendar-event-time').value;
            const title = document.getElementById('calendar-event-title').value.trim();
            const desc = document.getElementById('calendar-event-desc').value.trim();

            if (!date || !title) {
                showAlert('입력 오류', '날짜와 제목을 입력해주세요.');
                return;
            }

            if (!db) return;
            const { collection, addDoc, doc, updateDoc } = window.firebaseAppModules;
            try {
                if (editId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'calendar', editId), {
                        date, time, title, desc
                    });
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'calendar'), {
                        date, time, title, desc, uploader: currentUserData.name, createdAt: Date.now()
                    });
                }
                closeModal('calendar-event-modal');
                showToast('일정이 저장되었습니다.');
                selectCalendarDate(date);
            } catch (e) {
                showAlert('저장 오류', '일정 저장 중 오류가 발생했습니다.');
            }
        }

        function deleteCalendarEvent(id) {
            showConfirm('일정 삭제', '정말 이 일정을 삭제하시겠습니까?', async () => {
                if (!db) return;
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'calendar', id));
                showToast('일정이 삭제되었습니다.');
                if (selectedCalendarDateStr) renderCalendarDetail(selectedCalendarDateStr);
            });
        }

        async function sendBoardPost() {
            const input = document.getElementById('board-input');
            const text = input.value.trim();
            if (!text) return;

            if (!db) return;
            const { collection, addDoc } = window.firebaseAppModules;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'board'), {
                    text, uploader: currentUserData.name, createdAt: Date.now()
                });
                input.value = '';
            } catch (e) {}
        }

        function loadBoard() {
            const container = document.getElementById('board-list');
            if (!container) return;
            container.innerHTML = '';

            if (boardData.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">작성된 게시글이 없습니다.</div>`;
                return;
            }

            boardData.forEach(p => {
                const isAdmin = currentUserData && currentUserData.role === 'admin';
                const isMyPost = currentUserData && p.uploader === currentUserData.name;
                const canManage = isAdmin || isMyPost;

                const div = document.createElement('div');
                div.className = `p-3 rounded-2xl border flex flex-col gap-1.5 ${isMyPost ? 'bg-indigo-50/40 border-indigo-100 ml-4' : 'bg-white border-gray-200 mr-4'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-gray-500">
                        <span class="font-bold ${isMyPost ? 'text-indigo-600' : 'text-gray-700'}">${escapeHtml(p.uploader || '익명')}</span>
                        <div class="flex items-center gap-2">
                            <span>${new Date(p.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            ${canManage ? `
                                ${isMyPost ? `<button onclick="openEditBoard('${p.id}')" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen text-xs"></i></button>` : ''}
                                <button onclick="deleteBoardPost('${p.id}')" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                            ` : ''}
                        </div>
                    </div>
                    <p class="text-xs sm:text-sm text-gray-800 whitespace-pre-line">${escapeHtml(p.text)}</p>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function openEditBoard(id) {
            const p = boardData.find(x => x.id === id);
            if (!p) return;
            const newText = prompt('게시글 수정', p.text);
            if (newText !== null && newText.trim() !== '') {
                if (!db) return;
                const { doc, updateDoc } = window.firebaseAppModules;
                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'board', id), { text: newText.trim() });
            }
        }

        function deleteBoardPost(id) {
            showConfirm('게시글 삭제', '정말 이 게시글을 삭제하시겠습니까?', async () => {
                if (!db) return;
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'board', id));
                showToast('게시글이 삭제되었습니다.');
            });
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            renderAdminModalContent();
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function switchAdminTab(tab) {
            const pendingView = document.getElementById('admin-pending-view');
            const activeView = document.getElementById('admin-active-view');
            const tabPending = document.getElementById('tab-admin-pending');
            const tabActive = document.getElementById('tab-admin-active');

            if (tab === 'pending') {
                pendingView.classList.remove('hidden');
                activeView.classList.add('hidden');
                tabPending.className = 'flex-1 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition';
                tabActive.className = 'flex-1 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition';
            } else {
                activeView.classList.remove('hidden');
                pendingView.classList.add('hidden');
                tabActive.className = 'flex-1 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition';
                tabPending.className = 'flex-1 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition';
            }
        }

        function renderAdminModalContent() {
            const pendingView = document.getElementById('admin-pending-view');
            const activeView = document.getElementById('admin-active-view');
            if (!pendingView || !activeView) return;

            pendingView.innerHTML = '';
            activeView.innerHTML = '';

            if (pendingUsers.length === 0) {
                pendingView.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">가입 대기중인 팀원이 없습니다.</div>';
            } else {
                pendingUsers.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100';
                    div.innerHTML = `
                        <div>
                            <h4 class="font-bold text-gray-800 text-xs sm:text-sm">${escapeHtml(u.name)}</h4>
                            <span class="text-[10px] text-gray-400">가입신청</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="approveUser('${u.id}')" class="px-3.5 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-medium hover:bg-emerald-700">승인</button>
                            <button onclick="rejectUser('${u.id}')" class="px-3.5 py-1.5 bg-red-100 text-red-600 rounded-xl text-xs font-medium hover:bg-red-200">거절</button>
                        </div>
                    `;
                    pendingView.appendChild(div);
                });
            }

            if (activeUsers.length === 0) {
                activeView.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">등록된 팀원이 없습니다.</div>';
            } else {
                activeUsers.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100';
                    div.innerHTML = `
                        <div>
                            <h4 class="font-bold text-gray-800 text-xs sm:text-sm">${escapeHtml(u.name)} ${u.role === 'admin' ? '(관리자)' : ''}</h4>
                            <span class="text-[10px] text-emerald-600 font-medium">활동중</span>
                        </div>
                        ${u.name !== '관리자' ? `<button onclick="rejectUser('${u.id}')" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs hover:bg-red-100">내보내기</button>` : ''}
                    `;
                    activeView.appendChild(div);
                });
            }
        }

        async function approveUser(id) {
            if (!db) return;
            const { doc, updateDoc } = window.firebaseAppModules;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id), { status: 'active' });
            showToast('팀원이 승인되었습니다.');
        }

        async function rejectUser(id) {
            showConfirm('팀원 관리', '정말 이 회원을 거절/삭제하시겠습니까?', async () => {
                if (!db) return;
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id));
                showToast('회원이 삭제되었습니다.');
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showAlert(title, message, callback) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const modal = document.getElementById('custom-alert-modal');
            modal.classList.remove('hidden');
            const btn = document.getElementById('alert-action-btn');
            btn.onclick = () => {
                modal.classList.add('hidden');
                if (callback) callback();
            };
        }

        let confirmCallback = null;
        function showConfirm(title, message, cb) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            confirmCallback = cb;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeCustomConfirm();
        };

        function showToast(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg fade-in flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
