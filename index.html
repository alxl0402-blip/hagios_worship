                    </div>

    <script>
        let db = null;
        let auth = null;
        let currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hagios-worship-app';
        let currentCalendarDate = new Date();
        let store = { users: [], todos: [], calendar: [], sheets: [], audio: [], board: [], konti: [] };
        
        let isFirebaseReady = false;
        let isCloudMode = false;

        let alertCallback = null;
        function showAlert(title, message, type = 'info', buttonText = '확인', callback = null) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            document.getElementById('alert-action-btn').textContent = buttonText;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if (type === 'success') {
                iconContainer.className = 'w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-check';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else if (type === 'error') {
                iconContainer.className = 'w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-xmark';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else {
                iconContainer.className = 'w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                icon.className = 'fa-solid fa-circle-info';
                document.getElementById('alert-action-btn').className = 'w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            }

            alertCallback = callback;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            if (alertCallback) { alertCallback(); alertCallback = null; }
        }
        document.getElementById('alert-action-btn').addEventListener('click', closeAlert);

        let confirmCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = callback;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', async () => {
            if (confirmCallback) await confirmCallback();
            closeCustomConfirm();
        });

        // Global Enter key listener for all open modals, popups, and dialogs
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                // Ignore if typing inside the board textarea (so user can line break)
                if (document.activeElement && document.activeElement.id === 'board-input') {
                    return;
                }

                // If custom alert modal is open
                const alertModal = document.getElementById('custom-alert-modal');
                if (alertModal && !alertModal.classList.contains('hidden')) {
                    e.preventDefault();
                    closeAlert();
                    return;
                }
                
                // If custom confirm modal is open
                const confirmModal = document.getElementById('custom-confirm-modal');
                if (confirmModal && !confirmModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('confirm-action-btn').click();
                    return;
                }

                // If calendar modal is open
                const calModal = document.getElementById('calendar-event-modal');
                if (calModal && !calModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('save-cal-event-btn').click();
                    return;
                }

                // If konti modal is open
                const kontiModal = document.getElementById('konti-modal');
                if (kontiModal && !kontiModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('save-konti-btn').click();
                    return;
                }

                // If sheet modal is open
                const sheetModal = document.getElementById('sheet-modal');
                if (sheetModal && !sheetModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('add-sheet-btn').click();
                    return;
                }

                // If audio modal is open
                const audioModal = document.getElementById('audio-modal');
                if (audioModal && !audioModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('add-audio-btn').click();
                    return;
                }
            }
        });

        window.addEventListener('firebaseReady', async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseAppModules;
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                const firebaseConfig = JSON.parse(configStr);
                
                if (Object.keys(firebaseConfig).length === 0) {
                    throw new Error("No Firebase config provided.");
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                isCloudMode = true;
                initFirebaseListeners();
                
            } catch (err) {
                console.warn("Firebase 연결 실패 (로컬 모드):", err);
                isCloudMode = false;
                initLocalFallback();
            } finally {
                isFirebaseReady = true;
                updateConnectionStatusUI();
                enableAuthForms();
                setTimeout(() => { checkSavedLogin(); }, 100);
            }
        });

        function updateConnectionStatusUI() {
            const authDot = document.getElementById('auth-connection-dot');
            const dashDot = document.getElementById('dash-connection-dot');
            const dashText = document.getElementById('connection-status-text');
            const colorClass = isCloudMode ? 'bg-emerald-500' : 'bg-amber-400';
            const titleText = isCloudMode ? '클라우드 동기화 됨' : '로컬 모드';
            
            if(authDot) { authDot.className = `absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white ${colorClass}`; authDot.title = titleText; }
            if(dashDot) { dashDot.className = `absolute -bottom-1 -right-1 w-3 h-3 rounded-full border-2 border-white ${colorClass}`; dashDot.title = titleText; }
            if(dashText) {
                dashText.textContent = isCloudMode ? 'Cloud' : 'Local';
                dashText.className = `text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm ${isCloudMode ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`;
            }
        }

        function enableAuthForms() {
            const overlay = document.getElementById('auth-loading-overlay');
            if (overlay) { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 300); }
            document.querySelectorAll('.auth-input, .auth-btn').forEach(el => el.removeAttribute('disabled'));
        }

        function checkSavedLogin() {
            const savedUser = localStorage.getItem('hagios_current_user');
            if(savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    startWorkspace();
                } catch(e) { localStorage.removeItem('hagios_current_user'); }
            }
        }

        function initLocalFallback() {
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(key => {
                if (!localStorage.getItem('ccm_' + key)) localStorage.setItem('ccm_' + key, JSON.stringify([]));
                store[key] = JSON.parse(localStorage.getItem('ccm_' + key)) || [];
            });
            refreshUI();
        }

        function initFirebaseListeners() {
            const { collection, onSnapshot, query } = window.firebaseAppModules;
            const attachListener = (collectionName, storeKey) => {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', collectionName));
                onSnapshot(q, (snapshot) => {
                    store[storeKey] = [];
                    snapshot.forEach(docSnap => { store[storeKey].push({ id: docSnap.id, ...docSnap.data() }); });
                    if(collectionName === 'users') {
                        updateAdminBadge();
                        if(currentUser && currentUser.isAdmin) renderAdminViews();
                    }
                    if(currentUser) refreshUI();
                }, (error) => { console.error(`Error loading ${collectionName}:`, error); });
            };
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(k => attachListener(k, k));
        }
        
        function updateAdminBadge() {
            if (!currentUser || !currentUser.isAdmin) return;
            const users = getCollectionData('users');
            const pendingCount = users.filter(u => u.status === 'pending').length;
            const desktopBadge = document.getElementById('admin-badge-desktop');
            const mobileBadge = document.getElementById('admin-badge-mobile');
            if (pendingCount > 0) {
                if(desktopBadge) { desktopBadge.textContent = pendingCount; desktopBadge.classList.remove('hidden'); }
                if(mobileBadge) { mobileBadge.textContent = pendingCount; mobileBadge.classList.remove('hidden'); }
            } else {
                if(desktopBadge) desktopBadge.classList.add('hidden');
                if(mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        function refreshUI() {
            renderCalendar();
            loadTodos();
            loadSheets();
            loadAudio();
            loadBoard();
            loadKonti();
            updateStats();
        }

        async function dbAdd(collectionName, data) {
            if (!isFirebaseReady) return false;
            if (isCloudMode && db && auth && auth.currentUser) {
                try {
                    const { collection, addDoc } = window.firebaseAppModules;
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), data);
                    return true;
                } catch(e) { console.error("Cloud Add Error:", e); return false; }
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list.unshift({ id: 'local_' + Date.now(), ...data });
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
                return true;
            }
        }

        async function dbUpdate(collectionName, id, data) {
            if (isCloudMode && db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, updateDoc } = window.firebaseAppModules;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.map(item => item.id == id ? { ...item, ...data } : item);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbDelete(collectionName, id) {
            if (isCloudMode && db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.filter(item => item.id != id);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        function getCollectionData(collectionName) {
            if (store[collectionName] && store[collectionName].length > 0) return store[collectionName];
            return JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
        }

        async function handleSignup() {
            if (!isFirebaseReady) return;
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            if(!username || !password) { showToast('이름과 비밀번호를 모두 입력해주세요.', 'error'); return; }
            
            const users = getCollectionData('users');
            if(users.find(u => u.username === username)) { showToast('이미 존재하는 이름입니다.', 'error'); return; }
            
            const success = await dbAdd('users', { username, password, status: 'pending', isAdmin: false, createdAt: Date.now() });
            if (success) {
                document.getElementById('signup-username').value = '';
                document.getElementById('signup-password').value = '';
                showAlert('가입 신청 완료', '회원가입 신청이 완료되었습니다.\n관리자 승인 후 로그인이 가능합니다.', 'success', '로그인 화면으로', () => { toggleAuthMode('login'); });
            } else {
                showToast('회원가입 처리 중 문제가 발생했습니다.', 'error');
            }
        }

        function handleLogin() {
            if (!isFirebaseReady) return;
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if(username === '관리자' && password === 'hagios') {
                currentUser = { id: 'admin_main', username: '관리자', isAdmin: true, status: 'approved' };
                localStorage.setItem('hagios_current_user', JSON.stringify(currentUser));
                startWorkspace();
                return;
            }

            const users = getCollectionData('users');
            const user = users.find(u => u.username === username);

            if(!user) { showAlert('로그인 실패', '가입되지 않은 이름입니다.', 'error'); return; }
            if(user.password !== password) { showAlert('로그인 실패', '비밀번호 오류입니다.', 'error'); return; }
            if(user.status === 'pending') { showAlert('승인 대기 중', '관리자 승인을 기다리고 있습니다.', 'info'); return; }
            if(user.status === 'suspended') { showAlert('이용 정지', '일시 정지된 계정입니다.', 'error'); return; }

            currentUser = user;
            localStorage.setItem('hagios_current_user', JSON.stringify(user));
            startWorkspace();
        }

        function handleLogout() {
            localStorage.removeItem('hagios_current_user');
            currentUser = null;

        }

            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border ${colors[type]} fade-in pointer-events-auto backdrop-blur-md bg-opacity-90`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span class="text-sm font-semibold">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const titleEl = document.getElementById('calendar-title');
            if(!grid || !titleEl) return;
            grid.innerHTML = '';
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const calendarEvents = getCollectionData('calendar');

            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="p-1 sm:p-2 border border-transparent rounded-xl bg-gray-50/50 min-h-[80px] sm:min-h-[110px]"></div>`;
            }

            for(let i = 1; i <= totalDays; i++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
                const bgClass = isToday ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-gray-100 hover:border-indigo-300';
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const dayEvents = calendarEvents.filter(ev => {
                    if (!ev.startDate) return false;
                    return dateKey >= ev.startDate && dateKey <= (ev.endDate || ev.startDate);
                });

                let eventsHtml = '';
                dayEvents.slice(0, 3).forEach(dt => {
                    let timeDisplay = dt.time ? `<span class="opacity-75 mr-1">[${dt.time}]</span>` : '';
                    eventsHtml += `<div class="text-[9px] sm:text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded truncate w-full text-left mt-1 font-medium shadow-sm">${timeDisplay}${escapeHtml(dt.text)}</div>`;
                });

                grid.innerHTML += `<div onclick="openCalendarDateModal('${dateKey}')" class="p-1.5 sm:p-2 border rounded-xl ${bgClass} min-h-[80px] sm:min-h-[110px] flex flex-col justify-start items-start cursor-pointer transition">
                    <div class="w-full flex justify-between items-center mb-1"><span class="text-xs sm:text-sm font-semibold">${i}</span></div>
                    <div class="w-full flex flex-col gap-0.5 overflow-hidden">${eventsHtml}</div>
                </div>`;
            }
        }

            if(!editId && fileInput.files.length === 0) { showToast('파일을 선택해주세요.', 'error'); return; }
            const btn = document.getElementById('add-sheet-btn');
            btn.disabled = true;

            if (editId) {
                let sheet = getCollectionData('sheets').find(s => s.id == editId);
                let updateData = { title: title || sheet.title };
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (!title) updateData.title = file.name.replace(/\.[^/.]+$/, "");
                    updateData.filename = file.name;
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        updateData.data = e.target.result;
                        await dbUpdate('sheets', editId, updateData);
                        finishSheetUpload('악보가 수정되었습니다.', btn);
                    };
                    reader.readAsDataURL(file);
                } else {
                    await dbUpdate('sheets', editId, updateData);
                    finishSheetUpload('악보 정보가 수정되었습니다.', btn);

                const file = fileInput.files[0];

            list.innerHTML = '';
            if(audios.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm bg-white rounded-2xl border border-gray-100 flex flex-col items-center"><i class="fa-solid fa-headphones text-4xl mb-3 opacity-30"></i>등록된 음원이 없습니다.</div>`;
                return;
            }
            audios.forEach(audio => {
                const item = document.createElement('div');
                item.className = 'bg-white border border-gray-200 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center gap-4 hover:shadow-md transition relative group';
                let mediaContent = audio.type === 'file' ? `<audio controls class="w-full sm:max-w-md h-10 mt-3 rounded-lg"><source src="${audio.data}" type="audio/mpeg"></audio>` : `<a href="${audio.data}" target="_blank" class="inline-flex items-center gap-2 mt-3 px-4 py-2 bg-gray-100 hover:bg-purple-100 text-gray-700 rounded-lg text-sm font-semibold transition truncate"><i class="fa-solid fa-link"></i> 외부 링크 열기</a>`;
                item.innerHTML = `
                    <div class="flex items-start gap-4 w-full flex-1 overflow-hidden">
                        <div class="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center text-purple-500 flex-shrink-0 text-xl shadow-inner mt-1"><i class="fa-solid fa-music"></i></div>
                        <div class="flex-1 overflow-hidden pr-12"><h4 class="font-bold text-gray-800 text-sm truncate">${escapeHtml(audio.title)}</h4>${mediaContent}</div>
                    </div>
                    <div class="absolute top-4 right-4 flex gap-1">
                        <button onclick="openEditAudio('${audio.id}')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-50 text-gray-400 hover:text-purple-600 transition" title="수정"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteAudio('${audio.id}')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-50 text-gray-400 hover:text-red-500 transition" title="삭제"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
            updateStats();
        }

        document.getElementById('add-audio-btn').addEventListener('click', async () => {
            const editId = document.getElementById('audio-edit-id').value;
            let title = document.getElementById('audio-title').value.trim();
            const fileInput = document.getElementById('audio-file');
            const urlInput = document.getElementById('audio-url').value.trim();
            
            if(!editId && fileInput.files.length === 0 && !urlInput) { showToast('음원 파일이나 링크를 입력해주세요.', 'error'); return; }
            const btn = document.getElementById('add-audio-btn');
            btn.disabled = true;

            if (editId) {
                let audio = getCollectionData('audio').find(a => a.id == editId);
                let updateData = { title: title || audio.title };
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    updateData.type = 'file';
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        updateData.data = e.target.result;
                        await dbUpdate('audio', editId, updateData);
                        finishAudioUpload('음원이 수정되었습니다.', btn);
                    };
                    reader.readAsDataURL(file);
                } else if (urlInput) {
                    updateData.type = 'url';
                    updateData.data = urlInput;
                    await dbUpdate('audio', editId, updateData);
                    finishAudioUpload('음원이 수정되었습니다.', btn);
                } else {
                    await dbUpdate('audio', editId, updateData);
                    finishAudioUpload('음원 정보가 수정되었습니다.', btn);
                }
            } else {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (!title) title = file.name.replace(/\.[^/.]+$/, "");
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        await dbAdd('audio', { title, type: 'file', data: e.target.result, createdAt: Date.now() });
                        finishAudioUpload('음원이 등록되었습니다.', btn);
                    };
                    reader.readAsDataURL(file);
                } else {
                    if (!title) title = "링크 음원";
                    await dbAdd('audio', { title, type: 'url', data: urlInput, createdAt: Date.now() });
                    finishAudioUpload('음원 링크가 등록되었습니다.', btn);
                }
            }
        });

        function finishAudioUpload(msg, btn) {
            closeModal('audio-modal'); showToast(msg, 'success');
            btn.disabled = false; document.getElementById('audio-edit-id').value = '';
            document.getElementById('audio-title').value = ''; document.getElementById('audio-file').value = '';
            document.getElementById('audio-url').value = '';
        }

        window.openEditAudio = (id) => {
            let audio = getCollectionData('audio').find(a => a.id == id);
            if (!audio) return;
            document.getElementById('audio-edit-id').value = audio.id;
            document.getElementById('audio-title').value = audio.title || '';
            document.getElementById('audio-file').value = '';
            document.getElementById('audio-url').value = audio.type === 'url' ? audio.data : '';
            document.getElementById('audio-modal').classList.remove('hidden');
        };

        window.deleteAudio = async (id) => {
            showCustomConfirm('음원 삭제', '이 음원을 삭제하시겠습니까?', async () => {
                await dbDelete('audio', id); showToast('음원이 삭제되었습니다.', 'info');
            });
        };

        // [콘티]
        function renderKontiSheetCheckboxes(selectedIds = []) {
            const container = document.getElementById('konti-sheets-checkboxes');
            const search = (document.getElementById('konti-sheet-search')?.value || '').toLowerCase();
            const sheets = getCollectionData('sheets');
            container.innerHTML = '';
            if (sheets.length === 0) { container.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">등록된 악보가 없습니다.</div>`; return; }
            sheets.filter(s => s.title.toLowerCase().includes(search)).forEach(sheet => {
                const isChecked = selectedIds.includes(sheet.id) ? 'checked' : '';
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2 rounded-lg bg-white hover:bg-indigo-50 border border-gray-100 transition shadow-sm mb-1">
                        <label class="flex items-center gap-3 cursor-pointer flex-1 overflow-hidden">
                            <input type="checkbox" value="${sheet.id}" ${isChecked} class="konti-sheet-checkbox w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-xs sm:text-sm text-gray-700 truncate">${escapeHtml(sheet.title)}</span>
                        </label>
                    </div>
                `;
            });
        }
        window.filterKontiSheetCheckboxes = () => { renderKontiSheetCheckboxes(Array.from(document.querySelectorAll('.konti-sheet-checkbox:checked')).map(cb => cb.value)); };

        function loadKonti() {
            const list = document.getElementById('konti-list');
            const search = (document.getElementById('konti-search')?.value || '').toLowerCase();
            let kontiList = getCollectionData('konti');
            const sheets = getCollectionData('sheets');
            if (search) kontiList = kontiList.filter(k => k.name.toLowerCase().includes(search));
            list.innerHTML = '';
            if(kontiList.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm bg-white rounded-2xl border border-gray-100 flex flex-col items-center"><i class="fa-solid fa-list-ol text-4xl mb-3 opacity-30"></i>등록된 콘티가 없습니다.</div>`;
                return;
            }
            kontiList.forEach(konti => {
                const kontiSheets = (konti.sheetIds || []).map(id => sheets.find(s => s.id == id)).filter(s => s !== undefined);
                let sheetsHtml = kontiSheets.length === 0 ? `<p class="text-xs text-gray-400 italic">포함된 악보가 없습니다.</p>` : '';
                kontiSheets.forEach((sheet, idx) => {
                    sheetsHtml += `
                        <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-100">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <span class="w-5 h-5 rounded bg-white text-gray-600 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                                <span class="text-xs sm:text-sm font-medium text-gray-800 truncate">${escapeHtml(sheet.title)}</span>
                            </div>
                            <a href="${sheet.data}" download="${escapeHtml(sheet.filename || 'sheet')}" class="text-xs text-indigo-600 font-semibold hover:underline"><i class="fa-solid fa-download"></i> 다운로드</a>
                        </div>
                    `;
                });
                const item = document.createElement('div');
                item.className = 'bg-white border border-gray-200 rounded-2xl p-5 shadow-sm';
                const btnId = `btn-pdf-${konti.id}`;
                item.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 pb-3 border-b border-gray-100">
                        <div><h3 class="font-bold text-gray-800 text-sm sm:text-base">${escapeHtml(konti.name)}</h3><p class="text-[11px] text-gray-400 mt-0.5">총 ${kontiSheets.length}곡 포함</p></div>
                        <div class="flex items-center gap-2">
                            <button id="${btnId}" onclick="downloadKontiMergedPdf('${konti.id}', '${btnId}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-file-pdf"></i> 전체 악보 다운로드 받기</button>
                            <button onclick="openEditKonti('${konti.id}')" class="text-gray-400 hover:text-indigo-600 p-1.5 text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteKonti('${konti.id}')" class="text-gray-400 hover:text-red-500 p-1.5 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">${sheetsHtml}</div>
                `;
                list.appendChild(item);
            });
            updateStats();
        }

        document.getElementById('save-konti-btn').addEventListener('click', async () => {
            const editId = document.getElementById('konti-edit-id').value;
            const name = document.getElementById('konti-name').value.trim();
            const sheetIds = Array.from(document.querySelectorAll('.konti-sheet-checkbox:checked')).map(cb => cb.value);
            if(!name) { showToast('콘티 이름을 입력하세요.', 'error'); return; }
            closeModal('konti-modal');
            if (editId) { await dbUpdate('konti', editId, { name, sheetIds }); showToast('콘티가 수정되었습니다.', 'success'); }
            else { await dbAdd('konti', { name, sheetIds, createdAt: Date.now() }); showToast('콘티가 생성되었습니다.', 'success'); }
            document.getElementById('konti-name').value = ''; document.getElementById('konti-edit-id').value = '';
        });

        window.openEditKonti = (id) => {
            let konti = getCollectionData('konti').find(k => k.id == id);
            if (!konti) return;
            document.getElementById('konti-edit-id').value = konti.id;
            document.getElementById('konti-name').value = konti.name;
            renderKontiSheetCheckboxes(konti.sheetIds || []);
            document.getElementById('konti-modal').classList.remove('hidden');
        };

        window.deleteKonti = async (id) => { await dbDelete('konti', id); showToast('콘티가 삭제되었습니다.', 'info'); };

        window.downloadKontiMergedPdf = async (kontiId, btnId) => {
            let konti = getCollectionData('konti').find(k => k.id == kontiId);
            let sheets = getCollectionData('sheets');
            if (!konti) return;
            const kontiSheets = (konti.sheetIds || []).map(id => sheets.find(s => s.id == id)).filter(s => s !== undefined);
            if (kontiSheets.length === 0) { showToast('포함된 악보가 없습니다.', 'error'); return; }

            const btn = document.getElementById(btnId);
            const originalHtml = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '생성중...';

            setTimeout(async () => {
                try {
                    const { PDFDocument } = PDFLib;
                    const mergedPdf = await PDFDocument.create();
                    for (let i = 0; i < kontiSheets.length; i++) {
                        let sheet = kontiSheets[i];
                        let dataUrl = sheet.data;
                        if (!dataUrl) continue;
                        let base64Data = dataUrl.split(',')[1];
                        let bytes = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                        if (dataUrl.includes('application/pdf')) {
                            const donorPdf = await PDFDocument.load(bytes);
                            const copiedPages = await mergedPdf.copyPages(donorPdf, donorPdf.getPageIndices());
                            copiedPages.forEach(p => mergedPdf.addPage(p));
                        } else if (dataUrl.includes('image/')) {
                            let img = dataUrl.includes('image/png') ? await mergedPdf.embedPng(bytes) : await mergedPdf.embedJpg(bytes);
                            let page = mergedPdf.addPage([img.width, img.height]);
                            page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                        }
                    }
                    const pdfBytes = await mergedPdf.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${konti.name.replace(/ /g, '_')}_전체악보.pdf`;
                    link.click();
                    showToast('전체 악보 다운로드가 시작됩니다.', 'success');
                } catch(e) {
                    showToast('PDF 생성 중 오류가 발생했습니다.', 'error');
                } finally {
                    btn.disabled = false; btn.innerHTML = originalHtml;
                }
            }, 50);
        };

        // [게시판]
        function loadBoard() {
            const list = document.getElementById('board-list');
            const posts = getCollectionData('board');
            posts.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
            list.innerHTML = '';
            if(posts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-20 flex-1 flex flex-col items-center justify-center text-sm"><i class="fa-regular fa-comments text-4xl mb-3 opacity-30"></i>게시글이 없습니다.</div>`;
                return;
            }
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'flex flex-col w-full sm:w-[90%] self-start items-start mb-3 group';
                const authorName = post.author ? `<div class="text-[11px] font-bold text-gray-600 ml-2 mb-1">${escapeHtml(post.author)}</div>` : '';
                
                const isOwner = currentUser && (post.author === currentUser.username || currentUser.isAdmin);
                const actionButtons = isOwner ? `
                    <div class="flex items-center gap-1">
                        <button class="text-gray-300 hover:text-indigo-600 transition text-xs opacity-0 group-hover:opacity-100" onclick="openEditPost('${post.id}', '${encodeURIComponent(post.text)}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="text-gray-300 hover:text-red-500 transition text-xs opacity-0 group-hover:opacity-100" onclick="deletePost('${post.id}')"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                ` : '';

                item.innerHTML = `
                    ${authorName}
                    <div class="flex items-end gap-2 w-full">
                        <div class="px-4 py-3 rounded-2xl bg-white border border-gray-200 text-gray-800 shadow-sm text-sm whitespace-pre-wrap leading-relaxed w-full">${escapeHtml(post.text)}</div>
                        <div class="flex flex-col items-start gap-1 flex-shrink-0">
                            <span class="text-[10px] text-gray-400">${post.time}</span>
                            ${actionButtons}
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
        }

        const boardInput = document.getElementById('board-input');
        boardInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    return; // Shift+Enter allows line break
                } else {
                    e.preventDefault();
                    if (e.isComposing) return;
                    document.getElementById('add-post-btn').click();
                }
            }
        });

        document.getElementById('add-post-btn').addEventListener('click', async () => {
            const input = document.getElementById('board-input');
            const text = input.value.trim();
            if(!text) return;
            const now = new Date();
            const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const authorName = currentUser ? currentUser.username : '익명';
            
            await dbAdd('board', { text, time: timeStr, author: authorName, createdAt: Date.now() });
            input.value = '';
        });

        window.openEditPost = async (id, encodedText) => {
            const currentText = decodeURIComponent(encodedText);
            const newText = prompt("게시글 수정", currentText);
            if (newText === null || !newText.trim()) return;
            await dbUpdate('board', id, { text: newText.trim() });
            showToast('게시글이 수정되었습니다.', 'success');
        };

        window.deletePost = async (id) => {
            showCustomConfirm('게시글 삭제', '이 게시글을 삭제하시겠습니까?', async () => {
                await dbDelete('board', id); showToast('게시글이 삭제되었습니다.', 'info');
            });
        };

        function openModal(id) {
            if (id === 'sheet-modal') {
                document.getElementById('sheet-edit-id').value = '';
                document.getElementById('sheet-title').value = '';
                document.getElementById('sheet-file').value = '';
                document.getElementById('sheet-file-name').textContent = '선택된 파일 없음';
                document.getElementById('sheet-modal-title').textContent = '새 악보 파일 등록';
            } else if (id === 'konti-modal') {
                document.getElementById('konti-edit-id').value = '';
                document.getElementById('konti-name').value = '';
                renderKontiSheetCheckboxes();
            } else if (id === 'audio-modal') {
                document.getElementById('audio-edit-id').value = '';
                document.getElementById('audio-title').value = '';
                document.getElementById('audio-file').value = '';
                document.getElementById('audio-url').value = '';
            }
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function escapeHtml(unsafe) { return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
