<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagios Worship 팀 워크스페이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf-lib for true multi-page PDF merging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- PDF.js for robust PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseAppModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query
        };
        window.firebaseReadyEvent = new Event('firebaseReady');
        window.dispatchEvent(window.firebaseReadyEvent);
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { background-color: #e0e7ff; color: #4f46e5; font-weight: 600; }
        .nav-item.active i { color: #4f46e5; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center bg-gray-50">

    <!-- 로그인 / 회원가입 오버레이 화면 -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl mb-4 text-2xl shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-music"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Hagios Worship</h1>
                <p class="text-slate-500 text-sm mt-1" id="auth-subtitle">팀 계정에 로그인하세요</p>
            </div>

            <!-- 로그인 폼 -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">사용자 이름</label>
                    <input type="text" id="login-username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="이름을 입력하세요">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="login-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="비밀번호">
                </div>
                <button onclick="handleLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-100 text-sm">로그인</button>
                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode('signup')" class="text-xs text-indigo-600 hover:underline">계정이 없으신가요? 회원가입</button>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signup-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">사용할 이름</label>
                    <input type="text" id="signup-username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="예: 김찬양">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="signup-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="사용할 비밀번호">
                </div>
                <button onclick="handleSignup()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-100 text-sm">회원가입 신청</button>
                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode('login')" class="text-xs text-slate-600 hover:underline">이미 계정이 있으신가요? 로그인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="dashboard-screen" class="w-full h-full flex flex-col md:flex-row bg-gray-50 overflow-hidden hidden fade-in">
        
        <!-- -->
        <aside class="w-full md:w-64 bg-white border-b md:border-r border-gray-200 flex flex-col shadow-sm flex-shrink-0 z-20">
            <!-- Header section - Fixed layout to prevent truncation -->
            <div class="p-3 md:p-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow flex-shrink-0">
                        <i class="fa-solid fa-music text-white text-sm"></i>
                    </div>
                    <span class="font-bold text-base md:text-lg text-gray-800 whitespace-nowrap">Hagios Worship</span>
                </div>
                <!-- Action Buttons right next to the title on mobile, below on desktop -->
                <div class="flex items-center gap-1.5 md:hidden">
                    <button id="admin-menu-btn-mobile" onclick="openAdminModal()" class="hidden bg-amber-100 text-amber-700 hover:bg-amber-200 px-2 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1"></i>회원관리</button>
                    <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600 p-1.5 bg-gray-100 rounded-lg" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    <button id="mobile-menu-btn" class="text-gray-500 hover:text-indigo-600 p-1.5 bg-gray-100 rounded-lg"><i class="fa-solid fa-bars"></i></button>
                </div>
            </div>
            
            <!-- Desktop Admin/Logout actions -->
            <div class="hidden md:flex flex-col gap-2 p-3 border-b border-gray-100">
                <div class="text-xs text-gray-500 mb-1 px-1 flex items-center gap-2"><i class="fa-solid fa-user"></i> <span id="current-user-name">사용자</span></div>
                <div class="flex gap-2">
                    <button id="admin-menu-btn-desktop" onclick="openAdminModal()" class="hidden flex-1 bg-amber-100 text-amber-700 hover:bg-amber-200 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1"><i class="fa-solid fa-shield-halved"></i> 회원관리</button>
                    <button onclick="handleLogout()" class="flex-1 bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-red-600 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>
                </div>
            </div>

            <!-- -->
            <nav id="sidebar-nav" class="hidden md:flex flex-col flex-1 overflow-y-auto py-2 md:py-4 bg-white md:bg-transparent border-b md:border-0 border-gray-200 absolute md:relative top-[57px] md:top-0 left-0 w-full md:w-auto z-30 shadow-lg md:shadow-none">
                <ul class="space-y-1 px-3">
                    <li><button class="nav-item active w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-dashboard"><i class="fa-solid fa-house w-5 text-center text-gray-400"></i><span>홈 (오버뷰)</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-calendar"><i class="fa-regular fa-calendar-days w-5 text-center text-gray-400"></i><span>캘린더</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-todos"><i class="fa-solid fa-check-double w-5 text-center text-gray-400"></i><span>투두리스트</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-sheetmusic"><i class="fa-solid fa-file-audio w-5 text-center text-gray-400"></i><span>악보</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-audio"><i class="fa-solid fa-headphones w-5 text-center text-gray-400"></i><span>음원</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-konti"><i class="fa-solid fa-list-ol w-5 text-center text-gray-400"></i><span>콘티</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-sm" data-target="view-board"><i class="fa-regular fa-comments w-5 text-center text-gray-400"></i><span>팀 게시판</span></button></li>
                </ul>
            </nav>
        </aside>

        <!-- -->
        <main class="flex-1 flex flex-col h-[calc(100vh-57px)] md:h-screen overflow-hidden bg-gray-50 relative">
            <div id="toast-container" class="absolute bottom-4 right-4 z-50 flex flex-col gap-2 max-w-xs sm:max-w-sm w-full px-4 sm:px-0 pointer-events-none"></div>

            <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 scroll-smooth w-full">
                
                <!-- View: Home Dashboard -->
                <section id="view-dashboard" class="view-section fade-in">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">팀 오버뷰</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xl flex-shrink-0"><i class="fa-solid fa-list-check"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">남은 할 일</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-todos">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xl flex-shrink-0"><i class="fa-solid fa-list-ol"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">등록된 콘티</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-konti">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-xl flex-shrink-0"><i class="fa-solid fa-file-lines"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">등록된 악보</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-sheet">0</p></div>
                        </div>
                        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 text-xl flex-shrink-0"><i class="fa-solid fa-music"></i></div>
                            <div><p class="text-xs sm:text-sm text-gray-500 font-medium">공유된 음원</p><p class="text-xl sm:text-2xl font-bold text-gray-800" id="stat-audio">0</p></div>
                        </div>
                    </div>
                </section>

                <!-- View: Calendar -->
                <section id="view-calendar" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">캘린더</h2>
                        <button onclick="openCalendarEventModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 일정 추가
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center gap-2">
                                <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <h3 id="calendar-title" class="font-bold text-sm sm:text-lg text-gray-800">2026년 9월</h3>
                                <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            </div>
                            <button onclick="resetCalendarToCurrent()" class="text-xs text-indigo-600 font-semibold hover:underline">오늘로 이동</button>
                        </div>
                        <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-xs sm:text-sm font-medium text-gray-500">
                            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                        </div>
                        <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs sm:text-sm" id="calendar-grid"></div>
                    </div>
                </section>

                <!-- View: Todo List -->
                <!-- -->
                <section id="view-todos" class="view-section hidden fade-in">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">투두리스트</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[500px] sm:h-[600px] max-h-[70vh]">
                        <div class="p-3 sm:p-4 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row gap-2">
                            <input type="text" id="todo-input" class="flex-1 px-3 sm:px-4 py-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="할 일을 입력하세요">
                            <div class="flex items-center gap-1">
                                <span class="text-xs text-gray-500 font-medium whitespace-nowrap">기한:</span>
                                <input type="date" id="todo-date" class="px-3 py-2 text-xs sm:text-sm border border-gray-300 rounded-lg outline-none focus:border-indigo-500 bg-white">
                            </div>
                            <button id="add-todo-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 sm:px-5 py-2 text-xs sm:text-sm rounded-lg font-medium transition shadow-sm whitespace-nowrap">추가</button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-3 sm:p-4" id="todo-list"></div>
                    </div>
                </section>
                
                <!-- View: Sheet Music -->
                <section id="view-sheetmusic" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">악보</h2>
                        <button onclick="openModal('sheet-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 악보 업로드
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="sheet-search" oninput="loadSheets()" class="w-full pl-11 pr-4 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none shadow-sm" placeholder="악보 검색...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="sheet-list"></div>
                </section>

                <!-- View: Audio -->
                <section id="view-audio" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">음원</h2>
                        <button onclick="openModal('audio-modal')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 음원 등록
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="audio-search" oninput="loadAudio()" class="w-full pl-11 pr-4 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none shadow-sm" placeholder="음원 검색...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-4" id="audio-list"></div>
                </section>

                <!-- View: Konti -->
                <!-- -->
                <section id="view-konti" class="view-section hidden fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">콘티</h2>
                        <button onclick="openModal('konti-modal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 새 콘티 만들기
                        </button>
                    </div>
                    <div class="mb-6">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="konti-search" oninput="loadKonti()" class="w-full pl-11 pr-4 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-sm" placeholder="콘티 검색...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-4" id="konti-list"></div>
                </section>

                <!-- View: Notice Board -->
                <section id="view-board" class="view-section hidden fade-in">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">팀 게시판</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[500px] sm:h-[600px] max-h-[70vh]">
                        <div class="flex-1 overflow-y-auto p-3 sm:p-4 bg-gray-50 flex flex-col gap-4" id="board-list"></div>
                        <div class="p-3 sm:p-4 border-t border-gray-200 bg-white">
                            <div class="flex gap-2">
                                <textarea id="board-input" rows="2" class="flex-1 px-3 sm:px-4 py-2.5 text-xs sm:text-sm border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" placeholder="팀원들에게 나눌 공지나 이야기를 남겨보세요..."></textarea>
                                <button id="add-post-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 sm:px-6 rounded-xl font-medium transition shadow-sm flex items-center justify-center">
                                    <i class="fa-solid fa-paper-plane text-sm sm:text-base"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- -->
    <!-- 커스텀 팝업(Alert) 모달 (안내용) -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl fade-in text-center">
            <div id="alert-icon-container" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i id="alert-icon" class="fa-solid fa-circle-info"></i>
            </div>
            <h3 class="font-bold text-gray-800 text-lg mb-2" id="alert-title">안내</h3>
            <p class="text-sm text-gray-500 mb-6 whitespace-pre-line" id="alert-message">메시지 내용</p>
            <button id="alert-action-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition text-sm shadow-sm">확인</button>
        </div>
    </div>

    <script>
        let db = null;
        let auth = null;
        let currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hagios-worship-app';
        let currentCalendarDate = new Date();
        let store = { users: [], todos: [], calendar: [], sheets: [], audio: [], board: [], konti: [] };

        // 커스텀 알럿 로직
        let alertCallback = null;
        function showAlert(title, message, type = 'info', buttonText = '확인', callback = null) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            document.getElementById('alert-action-btn').textContent = buttonText;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if (type === 'success') {
                iconContainer.className = 'w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-xl';
                icon.className = 'fa-solid fa-check';
                document.getElementById('alert-action-btn').className = 'w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else if (type === 'error') {
                iconContainer.className = 'w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-xl';
                icon.className = 'fa-solid fa-xmark';
                document.getElementById('alert-action-btn').className = 'w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            } else {
                iconContainer.className = 'w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-4 text-xl';
                icon.className = 'fa-solid fa-circle-info';
                document.getElementById('alert-action-btn').className = 'w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition text-sm shadow-sm';
            }

            alertCallback = callback;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            if (alertCallback) { alertCallback(); alertCallback = null; }
        }
        document.getElementById('alert-action-btn').addEventListener('click', closeAlert);

        // 커스텀 확인 로직
        let confirmCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = callback;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', async () => {
            if (confirmCallback) await confirmCallback();
            closeCustomConfirm();
        });

        window.addEventListener('firebaseReady', async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseAppModules;
            try {
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // 로그인 전에 익명으로라도 Firebase에 연결하여 users 데이터를 불러올 수 있도록 설정 (퍼블릭 데이터)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                initFirebaseListeners();
                checkSavedLogin();
            } catch (err) {
                console.error("Firebase init error:", err);
                initLocalFallback();
                checkSavedLogin();
            }
        });

        function checkSavedLogin() {
            const savedUser = localStorage.getItem('hagios_current_user');
            if(savedUser) {
                currentUser = JSON.parse(savedUser);
                startWorkspace();
            }
        }

        function initLocalFallback() {
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(key => {
                if (!localStorage.getItem('ccm_' + key)) localStorage.setItem('ccm_' + key, JSON.stringify([]));
            });
            refreshUI();
        }

        function initFirebaseListeners() {
            const { collection, onSnapshot, query } = window.firebaseAppModules;
            const attachListener = (collectionName, storeKey) => {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', collectionName));
                onSnapshot(q, (snapshot) => {
                    store[storeKey] = [];
                    snapshot.forEach(docSnap => { store[storeKey].push({ id: docSnap.id, ...docSnap.data() }); });
                    
                    if(collectionName === 'users' && currentUser && currentUser.isAdmin) {
                        renderAdminViews();
                    }
                    if(currentUser) refreshUI();
                }, (error) => { console.error(`Error loading ${collectionName}:`, error); });
            };
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(k => attachListener(k, k));
        }

        function refreshUI() {
            renderCalendar();
            loadTodos();
            loadSheets();
            loadAudio();
            loadBoard();
            loadKonti();
            updateStats();
        }

        async function dbAdd(collectionName, data) {
            if (db && auth && auth.currentUser) {
                const { collection, addDoc } = window.firebaseAppModules;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list.unshift({ id: 'local_' + Date.now(), ...data });
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbUpdate(collectionName, id, data) {
            if (db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, updateDoc } = window.firebaseAppModules;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.map(item => item.id == id ? { ...item, ...data } : item);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbDelete(collectionName, id) {
            if (db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.filter(item => item.id != id);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        function getCollectionData(collectionName) {
            if (db && auth && auth.currentUser) return store[collectionName] || [];
            return JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
        }

        // --- 로그인 및 인증 로직 ---
        function toggleAuthMode(mode) {
            if(mode === 'signup') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('signup-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '간편하게 팀 계정을 만드세요';
            } else {
                document.getElementById('signup-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '팀 계정에 로그인하세요';
            }
        }

        async function handleSignup() {
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            if(!username || !password) {
                showToast('이름과 비밀번호를 모두 입력해주세요.', 'error');
                return;
            }
            
            const users = getCollectionData('users');
            if(users.find(u => u.username === username)) {
                showToast('이미 존재하는 이름입니다.', 'error');
                return;
            }
            
            await dbAdd('users', { username, password, status: 'pending', isAdmin: false, createdAt: Date.now() });
            
            document.getElementById('signup-username').value = '';
            document.getElementById('signup-password').value = '';

            showAlert(
                '가입 신청 완료',
                '회원가입 신청이 완료되었습니다.\n관리자의 승인이 떨어지면 로그인이 가능합니다.',
                'success',
                '로그인 화면으로 돌아가기',
                () => { toggleAuthMode('login'); }
            );
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            // 마스터 관리자 하드코딩
            if(username === '관리자' && password === 'hagios') {
                currentUser = { id: 'admin_main', username: '관리자', isAdmin: true, status: 'approved' };
                localStorage.setItem('hagios_current_user', JSON.stringify(currentUser));
                startWorkspace();
                return;
            }

            const users = getCollectionData('users');
            const user = users.find(u => u.username === username);

            if(!user) {
                showAlert('로그인 실패', '가입되지 않은 이름입니다. 먼저 회원가입을 진행해주세요.', 'error');
                return;
            }
            if(user.password !== password) {
                showAlert('로그인 실패', '비밀번호 오류입니다.', 'error', '다시 입력하기');
                return;
            }
            if(user.status === 'pending') {
                showAlert('승인 대기 중', '관리자 승인을 기다리고 있습니다.\n승인 후 로그인해주세요.', 'info', '확인');
                return;
            }
            if(user.status === 'suspended') {
                showAlert('이용 정지', '일시 정지된 계정입니다.\n관리자에게 문의하세요.', 'error', '확인');
                return;
            }

            currentUser = user;
            localStorage.setItem('hagios_current_user', JSON.stringify(user));
            startWorkspace();
        }

        function handleLogout() {
            localStorage.removeItem('hagios_current_user');
            currentUser = null;
            location.reload();
        }

        function startWorkspace() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            
            document.getElementById('current-user-name').textContent = `${currentUser.username} ${currentUser.isAdmin ? '(관리자)' : ''}`;
            
            if(currentUser.isAdmin) {
                document.getElementById('admin-menu-btn-desktop').classList.remove('hidden');
                document.getElementById('admin-menu-btn-mobile').classList.remove('hidden');
                renderAdminViews();
            } else {
                document.getElementById('admin-menu-btn-desktop').classList.add('hidden');
                document.getElementById('admin-menu-btn-mobile').classList.add('hidden');
            }
            
            refreshUI();
            showToast(`${currentUser.username}님 환영합니다!`, 'success');
        }

        // --- 관리자 모달 및 기능 ---
        function openAdminModal() {
            renderAdminViews();
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function switchAdminTab(tab) {
            document.getElementById('tab-admin-pending').className = tab === 'pending' 
                ? 'flex-1 py-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition' 
                : 'flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition';
            
            document.getElementById('tab-admin-active').className = tab === 'active' 
                ? 'flex-1 py-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition' 
                : 'flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition';

            document.getElementById('admin-pending-view').style.display = tab === 'pending' ? 'block' : 'none';
            document.getElementById('admin-active-view').style.display = tab === 'active' ? 'block' : 'none';
        }

        function renderAdminViews() {
            const users = getCollectionData('users');
            const pendingUsers = users.filter(u => u.status === 'pending');
            const activeUsers = users.filter(u => u.status !== 'pending');

            document.getElementById('pending-badge').textContent = pendingUsers.length;

            const pendingView = document.getElementById('admin-pending-view');
            pendingView.innerHTML = '';
            if(pendingUsers.length === 0) {
                pendingView.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">가입 대기 중인 인원이 없습니다.</div>';
            } else {
                pendingUsers.forEach(u => {
                    pendingView.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-xl shadow-sm">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${escapeHtml(u.username)}</p>
                                <p class="text-[10px] text-gray-400">가입일: ${new Date(u.createdAt).toLocaleDateString()}</p>
                            </div>
                            <div class="flex gap-2">

            const colors = {

                'error': 'bg-red-100 text-red-800 border-red-200',
                'info': 'bg-blue-100 text-blue-800 border-blue-200'
            };
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            toast.className = `flex items-center gap-2 px-4 py-3 rounded-lg shadow-md border ${colors[type]} fade-in pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-xs sm:text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const titleEl = document.getElementById('calendar-title');
            if(!grid || !titleEl) return;
            grid.innerHTML = '';
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const calendarEvents = getCollectionData('calendar');

            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="p-1 sm:p-2 border border-gray-100 rounded-lg bg-gray-50/30 min-h-[80px] sm:min-h-[110px]"></div>`;
            }

            for(let i = 1; i <= totalDays; i++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
                const bgClass = isToday ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-gray-100';
                const textClass = isToday ? 'text-indigo-700 font-bold' : 'text-gray-700';
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const dayEvents = calendarEvents.filter(ev => {
                    if (!ev.startDate) return false;
                    return dateKey >= ev.startDate && dateKey <= (ev.endDate || ev.startDate);
                });

                let eventsHtml = '';
                dayEvents.slice(0, 2).forEach(dt => {
                    eventsHtml += `<div class="text-[9px] sm:text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-100 px-1.5 py-0.5 rounded truncate w-full text-left mt-0.5 font-medium" title="${escapeHtml(dt.text)}">${escapeHtml(dt.text)}</div>`;
                });
                if (dayEvents.length > 2) {
                    eventsHtml += `<div class="text-[9px] text-gray-400 font-semibold mt-0.5 px-0.5">+${dayEvents.length - 2}개 더보기</div>`;
                }

                grid.innerHTML += `<div onclick="openCalendarDateModal('${dateKey}')" class="p-1.5 sm:p-2 border rounded-xl ${bgClass} min-h-[80px] sm:min-h-[110px] flex flex-col justify-start items-start shadow-2xs overflow-hidden cursor-pointer hover:border-indigo-300 transition group">
                    <div class="w-full flex justify-between items-center mb-1">
                        <span class="${textClass} text-xs sm:text-sm font-semibold">${i}</span>
                        <span class="text-[9px] text-gray-300 group-hover:text-indigo-500 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-plus"></i></span>
                    </div>
                    <div class="w-full flex flex-col gap-0.5 overflow-hidden">${eventsHtml}</div>
                </div>`;
            }
        }

        window.moveTodoOrder = async (id, direction) => {
            let todos = getCollectionData('todos');
            const index = todos.findIndex(t => t.id == id);
            if (index === -1) return;
            if (direction === 'up' && index > 0) {
                const temp = todos[index]; todos[index] = todos[index - 1]; todos[index - 1] = temp;
            } else if (direction === 'down' && index < todos.length - 1) {
                const temp = todos[index]; todos[index] = todos[index + 1]; todos[index + 1] = temp;
            } else return;
            if (db && auth && auth.currentUser) { store.todos = todos; loadTodos(); }
            else { localStorage.setItem('ccm_todos', JSON.stringify(todos)); store.todos = todos; loadTodos(); }
        };

                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];

                        const reader = new FileReader();
                        reader.onload = async function(e) {

                            await dbUpdate('sheets', editId, { title, data: e.target.result, filename: file.name });

                    } else {

            document.getElementById('konti-edit-id').value = '';
        });

        window.openEditKonti = (id) => {
            let konti = getCollectionData('konti').find(k => k.id == id);
            if (!konti) return;
            document.getElementById('konti-edit-id').value = konti.id;
            document.getElementById('konti-name').value = konti.name;
            document.getElementById('konti-modal-title').textContent = '콘티 수정';
            renderKontiSheetCheckboxes(konti.sheetIds || []);
            openModal('konti-modal');
        };

        window.deleteKonti = async (id) => { await dbDelete('konti', id); showToast('콘티가 삭제되었습니다.', 'info'); };

        window.downloadKontiMergedPdf = async (kontiId) => {
            let konti = getCollectionData('konti').find(k => k.id == kontiId);
            let sheets = getCollectionData('sheets');
            if (!konti) return;
            const kontiSheets = (konti.sheetIds || []).map(id => sheets.find(s => s.id == id)).filter(s => s !== undefined);
            if (kontiSheets.length === 0) { showToast('포함된 악보가 없습니다.', 'error'); return; }

            showToast(`[${konti.name}] 통합 PDF 생성 중...`, 'info');
            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let i = 0; i < kontiSheets.length; i++) {
                    let sheet = kontiSheets[i];
                    let dataUrl = sheet.data;
                    if (!dataUrl) continue;

                    try {
                        let base64Data = dataUrl.split(',')[1];
                        let binaryString = atob(base64Data);
                        let len = binaryString.length;
                        let bytes = new Uint8Array(len);
                        for (let j = 0; j < len; j++) {
                            bytes[j] = binaryString.charCodeAt(j);
                        }

                        if (dataUrl.includes('application/pdf')) {
                            const donorPdf = await PDFDocument.load(bytes);
                            const copiedPages = await mergedPdf.copyPages(donorPdf, donorPdf.getPageIndices());
                            copiedPages.forEach((page) => mergedPdf.addPage(page));
                        } else if (dataUrl.includes('image/')) {
                            let embeddedImage;
                            if (dataUrl.includes('image/png')) {
                                embeddedImage = await mergedPdf.embedPng(bytes);
                            } else {
                                embeddedImage = await mergedPdf.embedJpg(bytes);
                            }
                            const page = mergedPdf.addPage([embeddedImage.width, embeddedImage.height]);
                            page.drawImage(embeddedImage, {
                                x: 0,
                                y: 0,
                                width: embeddedImage.width,
                                height: embeddedImage.height,
                            });
                        }
                    } catch (e) {
                        console.error("Error processing sheet file:", e);
                    }
                }

                const mergedPdfBytes = await mergedPdf.save();
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${konti.name}_통합콘티악보.pdf`;
                link.click();
                showToast('통합 PDF 다운로드가 시작됩니다.', 'success');
            } catch (err) {
                console.error("PDF merge error:", err);
                showToast('PDF 통합 중 오류가 발생했습니다.', 'error');
            }
        };

        function loadAudio() {
            const list = document.getElementById('audio-list');
            const search = (document.getElementById('audio-search')?.value || '').toLowerCase();
            let audios = getCollectionData('audio');
            if (search) audios = audios.filter(a => a.title.toLowerCase().includes(search));
            list.innerHTML = '';
            if(audios.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-12 text-xs sm:text-sm bg-white rounded-2xl border border-gray-100"><p></p></div>`;
                return;
            }
            audios.forEach(audio => {
                const item = document.createElement('div');
                item.className = 'bg-white border border-gray-200 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center gap-4 hover:shadow-md transition relative group';
                let mediaContent = audio.type === 'file' ? `<audio controls class="w-full sm:w-72 h-9 mt-2"><source src="${audio.data}" type="audio/mpeg"></audio>` : `<a href="${audio.data}" target="_blank" class="inline-flex items-center gap-1.5 mt-2 text-xs text-purple-600 font-semibold hover:underline truncate"><i class="fa-solid fa-arrow-up-right-from-square"></i> 이동하기</a>`;
                item.innerHTML = `
                    <div class="flex items-center gap-3.5 w-full sm:w-auto flex-1 overflow-hidden">
                        <div class="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center text-purple-600 flex-shrink-0 text-base"><i class="fa-solid fa-headphones"></i></div>
                        <div class="flex-1 overflow-hidden pr-12 sm:pr-0"><h4 class="font-bold text-gray-800 text-xs sm:text-sm truncate">${escapeHtml(audio.title)}</h4>${mediaContent}</div>
                    </div>
                    <button class="absolute top-3 right-3 sm:relative text-gray-300 hover:text-red-500 transition p-1 text-xs" onclick="deleteAudio('${audio.id}')"><i class="fa-solid fa-trash-can"></i></button>
                `;
                list.appendChild(item);
            });
            updateStats();
        }

        document.getElementById('add-audio-btn').addEventListener('click', () => {
            let title = document.getElementById('audio-title').value.trim();
            const fileInput = document.getElementById('audio-file');
            const urlInput = document.getElementById('audio-url').value.trim();
            if(fileInput.files.length === 0 && !urlInput) { showToast('파일이나 링크를 입력해주세요.', 'error'); return; }
            closeModal('audio-modal');
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (!title) title = file.name;
                const reader = new FileReader();
                reader.onload = async function(e) {
                    await dbAdd('audio', { title, type: 'file', data: e.target.result, createdAt: Date.now() });
                    resetAudioForm();
                    showToast('음원이 업로드되었습니다.', 'success');
                };
                reader.readAsDataURL(file);
            } else {
                if (!title) title = urlInput;
                dbAdd('audio', { title, type: 'url', data: urlInput, createdAt: Date.now() }).then(() => {
                    resetAudioForm();
                    showToast('음원 링크가 등록되었습니다.', 'success');
                });
            }
        });

        function resetAudioForm() {
            document.getElementById('audio-title').value = '';
            document.getElementById('audio-file').value = '';
            document.getElementById('audio-url').value = '';
        }

        window.deleteAudio = async (id) => { await dbDelete('audio', id); showToast('음원이 삭제되었습니다.', 'info'); };

        function openModal(id) {
            if (id === 'sheet-modal') {
                document.getElementById('sheet-edit-id').value = '';
                document.getElementById('sheet-title').value = '';
                document.getElementById('sheet-file').value = '';
                document.getElementById('sheet-modal-title').textContent = '새 악보 등록';
            } else if (id === 'konti-modal') {
                document.getElementById('konti-edit-id').value = '';
                document.getElementById('konti-name').value = '';
                document.getElementById('konti-modal-title').textContent = '새 콘티 만들기';
                if(document.getElementById('konti-sheet-search')) document.getElementById('konti-sheet-search').value = '';
                renderKontiSheetCheckboxes();
            } else if (id === 'audio-modal') resetAudioForm();
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function loadBoard() {
            const list = document.getElementById('board-list');
            const posts = getCollectionData('board');
            list.innerHTML = '';
            if(posts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-10 flex-1 flex items-center justify-center text-xs sm:text-sm"><p>첫 게시글을 남겨보세요.</p></div>`;
                return;
            }
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'flex flex-col max-w-[85%] sm:max-w-[80%] self-start items-start mb-2 group';
                item.innerHTML = `
                    <div class="flex items-end gap-1 sm:gap-2">
                        <div class="px-3.5 py-2 sm:px-4 rounded-2xl bg-white border border-gray-200 text-gray-800 rounded-tl-none shadow-sm text-xs sm:text-sm whitespace-pre-wrap">${escapeHtml(post.text)}</div>
                        <span class="text-[9px] text-gray-400 mb-1">${post.time}</span>
                        <button class="text-gray-300 hover:text-red-500 transition text-[10px] mb-1" onclick="deletePost('${post.id}')"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
            list.scrollTop = list.scrollHeight;
        }

        document.getElementById('add-post-btn').addEventListener('click', async () => {
            const input = document.getElementById('board-input');
            const text = input.value.trim();
            if(!text) return;
            const now = new Date();
            const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            await dbAdd('board', { text, time: timeStr, createdAt: Date.now() });
            input.value = '';
            showToast('게시글이 등록되었습니다.', 'success');
        });

        window.deletePost = async (id) => { await dbDelete('board', id); showToast('게시글이 삭제되었습니다.', 'info'); };

        function escapeHtml(unsafe) {
            return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
