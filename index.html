                <button onclick="handleLogin()" class="w-full py-2.5 sm:py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-100 text-xs sm:text-sm">로그인</button>

                    <li><button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 md:px-4 md:py-2.5 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-xs sm:text-sm md:text-sm font-medium" data-target="view-audio"><i class="fa-solid fa-headphones w-5 text-center text-gray-400"></i><span>음원</span></button></li>
                    <li><button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 md:px-4 md:py-2.5 text-gray-600 rounded-lg hover:bg-gray-50 transition text-left text-xs sm:text-sm md:text-sm font-medium" data-target="view-konti"><i class="fa-solid fa-list-ol w-5 text-center text-gray-400"></i><span>콘티</span></button></li>

                            <div><h4 class="font-bold text-gray-800 text-xs sm:text-sm">투두리스트</h4></div>
                        </div>
                        <div onclick="navigateToView('view-sheetmusic')" class="bg-white p-3 sm:p-4 rounded-xl border border-gray-200 hover:border-emerald-500 hover:shadow-sm transition cursor-pointer flex items-center gap-3 group">
                            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-base sm:text-lg group-hover:bg-emerald-600 group-hover:text-white transition flex-shrink-0"><i class="fa-solid fa-file-audio"></i></div>
                            <div><h4 class="font-bold text-gray-800 text-xs sm:text-sm">악보</h4></div>

                        <div onclick="navigateToView('view-audio')" class="bg-white p-3 sm:p-4 rounded-xl border border-gray-200 hover:border-purple-500 hover:shadow-sm transition cursor-pointer flex items-center gap-3 group">

                            <div><h4 class="font-bold text-gray-800 text-xs sm:text-sm">음원</h4></div>

                        <div onclick="navigateToView('view-konti')" class="bg-white p-3 sm:p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:shadow-sm transition cursor-pointer flex items-center gap-3 group">

                            <div><h4 class="font-bold text-gray-800 text-xs sm:text-sm">콘티</h4></div>

                        <div onclick="navigateToView('view-board')" class="bg-white p-3 sm:p-4 rounded-xl border border-gray-200 hover:border-amber-500 hover:shadow-sm transition cursor-pointer flex items-center gap-3 group">

                            <div><h4 class="font-bold text-gray-800 text-xs sm:text-sm">공지</h4></div>
                        </div>

                        </button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-2 sm:p-3 mb-2.5">

                            <div class="flex items-center gap-1.5">
                                <button onclick="changeCalendarMonth(-1)" class="w-6 h-6 rounded-md border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600 text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                                <h3 id="calendar-title" class="font-bold text-xs sm:text-sm text-gray-800">2026년 9월</h3>
                                <button onclick="changeCalendarMonth(1)" class="w-6 h-6 rounded-md border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-600 text-xs"><i class="fa-solid fa-chevron-right"></i></button>

                        </div>

                        <div class="grid grid-cols-7 gap-0.5 text-center text-xs" id="calendar-grid"></div>
                    </div>

                    </div>
                </section>

    <script>
        let db = null;
        let auth = null;
        let currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hagios-worship-app';
        let currentCalendarDate = new Date();
        let selectedCalendarDateStr = null;
        let store = { users: [], todos: [], calendar: [], sheets: [], audio: [], board: [], konti: [] };

        let alertCallback = null;
        function showAlert(title, message, type = 'info', buttonText = '확인', callback = null) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            document.getElementById('alert-action-btn').textContent = buttonText;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if (type === 'success') {
                iconContainer.className = 'w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-2.5 text-base';
                icon.className = 'fa-solid fa-check';
                document.getElementById('alert-action-btn').className = 'w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition text-xs shadow-sm';
            } else if (type === 'error') {
                iconContainer.className = 'w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-2.5 text-base';
                icon.className = 'fa-solid fa-xmark';
                document.getElementById('alert-action-btn').className = 'w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition text-xs shadow-sm';
            } else {
                iconContainer.className = 'w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-2.5 text-base';
                icon.className = 'fa-solid fa-circle-info';
                document.getElementById('alert-action-btn').className = 'w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition text-xs shadow-sm';
            }

            alertCallback = callback;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            if (alertCallback) { alertCallback(); alertCallback = null; }
        }
        document.getElementById('alert-action-btn').addEventListener('click', closeAlert);

        let confirmCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = callback;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', async () => {
            if (confirmCallback) await confirmCallback();
            closeCustomConfirm();
        });

        // Global Enter key handler for modals and dialogs
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.activeElement && document.activeElement.id === 'board-input') {
                    return;
                }
                const alertModal = document.getElementById('custom-alert-modal');
                if (alertModal && !alertModal.classList.contains('hidden')) {
                    e.preventDefault();
                    closeAlert();
                    return;
                }
                const confirmModal = document.getElementById('custom-confirm-modal');
                if (confirmModal && !confirmModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('confirm-action-btn').click();
                    return;
                }
                const calModal = document.getElementById('calendar-event-modal');
                if (calModal && !calModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('save-cal-event-btn').click();
                    return;
                }
                const kontiModal = document.getElementById('konti-modal');
                if (kontiModal && !kontiModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('save-konti-btn').click();
                    return;
                }
                const sheetModal = document.getElementById('sheet-modal');
                if (sheetModal && !sheetModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('add-sheet-btn').click();
                    return;
                }
                const audioModal = document.getElementById('audio-modal');
                if (audioModal && !audioModal.classList.contains('hidden')) {
                    e.preventDefault();
                    document.getElementById('add-audio-btn').click();
                    return;
                }
            }
        });

        window.addEventListener('firebaseReady', async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseAppModules;
            try {
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (authErr) {
                    console.warn("Custom token auth failed, falling back to anonymous auth:", authErr);
                    await signInAnonymously(auth);
                }
                
                initFirebaseListeners();
                checkSavedLogin();
            } catch (err) {
                console.error("Firebase init error:", err);
                initLocalFallback();
                checkSavedLogin();
            }
        });

        function checkSavedLogin() {
            const savedUser = localStorage.getItem('hagios_current_user');
            if(savedUser) {
                currentUser = JSON.parse(savedUser);
                startWorkspace();
            }
        }

        function initLocalFallback() {
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(key => {
                if (!localStorage.getItem('ccm_' + key)) localStorage.setItem('ccm_' + key, JSON.stringify([]));
            });
            refreshUI();
        }

        function initFirebaseListeners() {
            const { collection, onSnapshot, query } = window.firebaseAppModules;
            const attachListener = (collectionName, storeKey) => {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', collectionName));
                onSnapshot(q, (snapshot) => {
                    store[storeKey] = [];
                    snapshot.forEach(docSnap => { store[storeKey].push({ id: docSnap.id, ...docSnap.data() }); });
                    
                    if(collectionName === 'users' && currentUser && currentUser.isAdmin) {
                        renderAdminViews();
                    }
                    if(currentUser) refreshUI();
                }, (error) => { console.error(`Error loading ${collectionName}:`, error); });
            };
            ['users', 'todos', 'calendar', 'sheets', 'audio', 'board', 'konti'].forEach(k => attachListener(k, k));
        }

        function refreshUI() {
            renderCalendar();
            loadTodos();
            loadSheets();
            loadAudio();
            loadBoard();
            loadKonti();
        }

        async function dbAdd(collectionName, data) {
            if (db && auth && auth.currentUser) {
                const { collection, addDoc } = window.firebaseAppModules;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list.unshift({ id: 'local_' + Date.now(), ...data });
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbUpdate(collectionName, id, data) {
            if (db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, updateDoc } = window.firebaseAppModules;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data);
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.map(item => item.id == id ? { ...item, ...data } : item);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        async function dbDelete(collectionName, id) {
            if (db && auth && auth.currentUser && !id.toString().startsWith('local_')) {
                const { doc, deleteDoc } = window.firebaseAppModules;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            } else {
                let list = JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
                list = list.filter(item => item.id != id);
                localStorage.setItem(`ccm_${collectionName}`, JSON.stringify(list));
                store[collectionName] = list;
                refreshUI();
            }
        }

        function getCollectionData(collectionName) {
            if (db && auth && auth.currentUser) return store[collectionName] || [];
            return JSON.parse(localStorage.getItem(`ccm_${collectionName}`)) || [];
        }

        function toggleAuthMode(mode) {
            if(mode === 'signup') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('signup-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '간편하게 팀 계정을 만드세요';
            } else {
                document.getElementById('signup-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').innerText = '팀 계정에 로그인하세요';
            }
        }

        async function handleSignup() {
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            if(!username || !password) {
                showToast('이름과 비밀번호를 모두 입력해주세요.', 'error');
                return;
            }
            
            const users = getCollectionData('users');
            if(users.find(u => u.username === username)) {
                showToast('이미 존재하는 이름입니다.', 'error');
                return;
            }
            
            await dbAdd('users', { username, password, status: 'pending', isAdmin: false, createdAt: Date.now() });
            
            document.getElementById('signup-username').value = '';
            document.getElementById('signup-password').value = '';

            showAlert(
                '가입 신청 완료',
                '회원가입 신청이 완료되었습니다.\n관리자의 승인이 떨어지면 로그인이 가능합니다.',
                'success',
                '로그인 화면으로 돌아가기',
                () => { toggleAuthMode('login'); }
            );
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if(username === '관리자' && password === 'hagios') {
                currentUser = { id: 'admin_main', username: '관리자', isAdmin: true, status: 'approved' };
                localStorage.setItem('hagios_current_user', JSON.stringify(currentUser));
                startWorkspace();
                return;
            }

            const users = getCollectionData('users');
            const user = users.find(u => u.username === username);

            if(!user) {
                showAlert('로그인 실패', '가입되지 않은 이름입니다. 먼저 회원가입을 진행해주세요.', 'error');
                return;
            }
            if(user.password !== password) {
                showAlert('로그인 실패', '비밀번호 오류입니다.', 'error', '다시 입력하기');
                return;
            }
            if(user.status === 'pending') {
                showAlert('승인 대기 중', '관리자 승인을 기다리고 있습니다.\n승인 후 로그인해주세요.', 'info', '확인');
                return;
            }
            if(user.status === 'suspended') {
                showAlert('이용 정지', '일시 정지된 계정입니다.\n관리자에게 문의하세요.', 'error', '확인');
                return;
            }

            currentUser = user;
            localStorage.setItem('hagios_current_user', JSON.stringify(user));
            startWorkspace();
        }

        function handleLogout() {
            localStorage.removeItem('hagios_current_user');
            currentUser = null;
            location.reload();
        }

            document.getElementById('auth-screen').classList.add('hidden');

            document.getElementById('current-user-name').textContent = `${currentUser.username} ${currentUser.isAdmin ? '(관리자)' : ''}`;

                document.getElementById('admin-menu-btn-mobile').classList.add('hidden');

            refreshUI();
            showToast(`${currentUser.username}님 환영합니다!`, 'success');

        async function adminActionUser(id, action, username) {
            if(action === 'approve') {

                    showToast(`${username}님의 계정이 정지되었습니다.`, 'info');
                    renderAdminViews();

            else if(action === 'delete') {
                showCustomConfirm('계정 영구 삭제', `${username}님의 계정을 완전히 삭제하시겠습니까?`, async () => {

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                'success': 'bg-green-100 text-green-800 border-green-200',
                'error': 'bg-red-100 text-red-800 border-green-200',
                'info': 'bg-blue-100 text-blue-800 border-green-200'
            };
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            toast.className = `flex items-center gap-2 px-3 py-2 rounded-lg shadow-md border ${colors[type]} fade-in pointer-events-auto text-xs`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Calendar Logic & Detail Panel ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const titleEl = document.getElementById('calendar-title');
            if(!grid || !titleEl) return;
            grid.innerHTML = '';
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const calendarEvents = getCollectionData('calendar');

            if (!selectedCalendarDateStr) {
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(today.getDate()).padStart(2, '0');
                selectedCalendarDateStr = `${year}-${mStr}-${dStr}`;
            }

            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="p-0.5 border border-gray-100 rounded-md bg-gray-50/30 min-h-[44px] sm:min-h-[55px]"></div>`;
            }

            for(let i = 1; i <= totalDays; i++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;
                const isSelected = selectedCalendarDateStr === dateKey;

                let bgClass = isToday ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-gray-100';
                if (isSelected) bgClass = 'bg-indigo-100 border-indigo-500 ring-2 ring-indigo-300';

                const dayEvents = calendarEvents.filter(ev => {
                    if (!ev.startDate) return false;
                    return dateKey >= ev.startDate && dateKey <= (ev.endDate || ev.startDate);
                });

                let eventsHtml = '';
                dayEvents.slice(0, 2).forEach(dt => {
                    let timeText = dt.time ? `[${dt.time}] ` : '';
                    eventsHtml += `<div class="text-[8px] bg-indigo-500 text-white px-1 py-0.5 rounded truncate w-full text-left mt-0.5 font-medium shadow-2xs" title="${escapeHtml(dt.text)}">${timeText}${escapeHtml(dt.text)}</div>`;
                });
                if (dayEvents.length > 2) {
                    eventsHtml += `<div class="text-[8px] text-gray-500 font-semibold mt-0.5 px-0.5">+${dayEvents.length - 2}</div>`;
                }

                grid.innerHTML += `<div onclick="selectCalendarDate('${dateKey}')" class="p-1 border rounded-md sm:rounded-lg ${bgClass} min-h-[44px] sm:min-h-[55px] flex flex-col justify-start items-start cursor-pointer hover:border-indigo-400 transition group">
                    <div class="w-full flex justify-between items-center mb-0.5">
                        <span class="text-[11px] sm:text-xs font-semibold text-gray-800">${i}</span>
                        ${dayEvents.length > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>' : ''}
                    </div>
                    <div class="w-full flex flex-col gap-0.5 overflow-hidden">${eventsHtml}</div>
                </div>`;
            }
            renderCalendarDetailPanel();
        }

        window.selectCalendarDate = (dateStr) => {
            selectedCalendarDateStr = dateStr;
            renderCalendar();
        };

        function renderCalendarDetailPanel() {
            const panelEl = document.getElementById('calendar-detail-panel');
            const titleEl = document.getElementById('calendar-detail-date-title');
            const contentEl = document.getElementById('calendar-detail-content');
            if(!panelEl || !titleEl || !contentEl) return;

            if(!selectedCalendarDateStr) {
                panelEl.classList.add('hidden');
                return;
            }

            const calendarEvents = getCollectionData('calendar');
            const dayEvents = calendarEvents.filter(ev => {
                if (!ev.startDate) return false;
                return selectedCalendarDateStr >= ev.startDate && selectedCalendarDateStr <= (ev.endDate || ev.startDate);
            });

            if (dayEvents.length === 0) {
                panelEl.classList.add('hidden');
                return;
            }

            panelEl.classList.remove('hidden');
            titleEl.textContent = `${selectedCalendarDateStr}`;

            let html = '';
            dayEvents.forEach(ev => {
                let timeDisplay = ev.time ? `<span class="bg-indigo-100 text-indigo-700 text-[10px] px-1.5 py-0.5 rounded font-semibold"><i class="fa-regular fa-clock mr-0.5"></i>${ev.time}</span>` : '';
                let periodDisplay = ev.startDate !== ev.endDate ? `<span class="text-[10px] text-gray-400">기간: ${ev.startDate} ~ ${ev.endDate}</span>` : '';
                let detailText = ev.detail ? `<div class="mt-1 text-[11px] text-gray-700 bg-gray-50 p-2 rounded-lg border border-gray-100 whitespace-pre-wrap">${escapeHtml(ev.detail)}</div>` : '';

                html += `
                    <div class="bg-white border border-gray-200 rounded-lg p-2.5 shadow-2xs relative group mb-2">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <h4 class="font-bold text-gray-800 text-xs">${escapeHtml(ev.text)}</h4>
                                ${timeDisplay}
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="openEditCalendarEvent('${ev.id}')" class="text-gray-400 hover:text-indigo-600 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteCalendarEvent('${ev.id}')" class="text-gray-400 hover:text-red-500 p-1 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        ${periodDisplay ? `<div class="mb-1">${periodDisplay}</div>` : ''}
                        ${detailText}
                    </div>
                `;
            });
            contentEl.innerHTML = html;
        }

            const newDate = prompt("기한 수정 (YYYY-MM-DD)", currentDate);
            if (newDate === null) return;
            dbUpdate('todos', id, { text: newText.trim(), dueDate: newDate.trim() });

        window.toggleTodo = async (id) => {
            const todo = getCollectionData('todos').find(t => t.id == id);
            if(todo) await dbUpdate('todos', id, { completed: !todo.completed });
        };

        window.moveTodoOrder = async (id, direction) => {
            let todos = getCollectionData('todos');
            const index = todos.findIndex(t => t.id == id);
            if (index === -1) return;
            if (direction === 'up' && index > 0) {
                const temp = todos[index]; todos[index] = todos[index - 1]; todos[index - 1] = temp;
            } else if (direction === 'down' && index < todos.length - 1) {
                const temp = todos[index]; todos[index] = todos[index + 1]; todos[index + 1] = temp;
            } else return;
            if (db && auth && auth.currentUser) { store.todos = todos; loadTodos(); }
            else { localStorage.setItem('ccm_todos', JSON.stringify(todos)); store.todos = todos; loadTodos(); }
        };

        window.downloadSheet = (id) => {
            const sheet = getCollectionData('sheets').find(s => s.id == id);
            if (!sheet || !sheet.data) { showToast('악보 파일을 찾을 수 없습니다.', 'error'); return; }
            try {
                const arr = sheet.data.split(',');
                let mime = 'application/pdf';
                if (arr[0].indexOf(':') !== -1 && arr[0].indexOf(';') !== -1) {
                    mime = arr[0].match(/:(.*?);/)[1];
                }
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--){ u8arr[n] = bstr.charCodeAt(n); }
                const blob = new Blob([u8arr], {type: mime});
                const filename = sheet.filename || `${sheet.title || 'sheet'}.pdf`;

                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(blobUrl);
                }, 1000);
                showToast('다운로드가 시작되었습니다.', 'success');
            } catch (e) {
                console.error("Download error:", e);
                try {
                    const win = window.open(sheet.data, '_blank');
                    if (!win) {
                        window.location.href = sheet.data;
                    }
                } catch (err) {
                    showToast('다운로드 중 오류가 발생했습니다.', 'error');

        };

        window.downloadKontiMergedPdf = async (kontiId) => {
            let konti = getCollectionData('konti').find(k => k.id == kontiId);
            let sheets = getCollectionData('sheets');
            if (!konti) return;
            const kontiSheets = (konti.sheetIds || []).map(id => sheets.find(s => s.id == id)).filter(s => s !== undefined);
            if (kontiSheets.length === 0) { showToast('포함된 악보가 없습니다.', 'error'); return; }

            showToast(`[${konti.name}] 전체 악보 PDF 생성 중...`, 'info');
            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let i = 0; i < kontiSheets.length; i++) {
                    let sheet = kontiSheets[i];
                    let dataUrl = sheet.data;
                    if (!dataUrl) continue;

                    try {
                        let base64Data = dataUrl.split(',')[1];
                        let binaryString = atob(base64Data);
                        let len = binaryString.length;
                        let bytes = new Uint8Array(len);
                        for (let j = 0; j < len; j++) { bytes[j] = binaryString.charCodeAt(j); }

                        if (dataUrl.includes('application/pdf')) {
                            const donorPdf = await PDFDocument.load(bytes);
                            const copiedPages = await mergedPdf.copyPages(donorPdf, donorPdf.getPageIndices());
                            copiedPages.forEach((page) => mergedPdf.addPage(page));
                        } else if (dataUrl.includes('image/')) {
                            let embeddedImage;
                            if (dataUrl.includes('image/png')) {
                                embeddedImage = await mergedPdf.embedPng(bytes);
                            } else {
                                embeddedImage = await mergedPdf.embedJpg(bytes);
                            }
                            const page = mergedPdf.addPage([embeddedImage.width, embeddedImage.height]);
                            page.drawImage(embeddedImage, { x: 0, y: 0, width: embeddedImage.width, height: embeddedImage.height });
                        }
                    } catch (e) {
                        console.error("Error processing sheet file:", e);
                    }
                }

                const mergedPdfBytes = await mergedPdf.save();
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `${konti.name.replace(/ /g, '_')}_전체악보.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                showToast('전체 악보 다운로드가 시작됩니다.', 'success');
            } catch (err) {
                console.error("PDF merge error:", err);
                showToast('PDF 통합 중 오류가 발생했습니다.', 'error');
            }
        };

            }
        });

        document.getElementById('add-post-btn').addEventListener('click', async () => {
            const input = document.getElementById('board-input');
            const text = input.value.trim();
            if(!text) return;
            const now = new Date();
            const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const authorName = currentUser ? currentUser.username : '익명';
            
            await dbAdd('board', { text, time: timeStr, author: authorName, createdAt: Date.now() });
            input.value = '';
        });

        window.openEditPost = async (id, encodedText) => {
            const currentText = decodeURIComponent(encodedText);
            const newText = prompt("게시글 수정", currentText);
            if (newText === null || !newText.trim()) return;
            await dbUpdate('board', id, { text: newText.trim() });
            showToast('게시글이 수정되었습니다.', 'success');
        };

        window.deletePost = async (id) => { await dbDelete('board', id); showToast('게시글이 삭제되었습니다.', 'info'); };

        function escapeHtml(unsafe) {
            return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
